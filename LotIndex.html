<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; max-width: 780px; margin: 24px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; }
    select, input { padding: 8px; font-size: 15px; margin-top: 4px; box-sizing: border-box; }
    select, input[type=text], input[type=number], input[type=date] { width: 100%; }
    button { padding: 9px 16px; font-size: 15px; cursor: pointer; border: none; border-radius: 4px; }
    .primary { background: #1a73e8; color: #fff; }
    .go { background: #188038; color: #fff; margin-top: 18px; }
    .go:disabled { background: #999; cursor: not-allowed; }
    .banner { margin-top: 14px; padding: 10px 12px; border-radius: 4px; background: #e8f0fe; font-size: 14px; }
    .warn { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #fef7e0; color: #b06000; font-size: 13px; }
    .err  { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #fce8e6; color: #c5221f; font-size: 14px; }
    .ok   { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #e6f4ea; color: #188038; font-size: 14px; }
    .card { border: 1px solid #dadce0; border-radius: 6px; padding: 12px 14px; margin-top: 14px; }
    .card h3 { margin: 0 0 4px 0; font-size: 15px; }
    .muted { color: #5f6368; font-size: 12px; font-weight: normal; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .samples { margin-top: 8px; }
    .chip { display: inline-block; background: #f1f3f4; border-radius: 12px; padding: 3px 8px; margin: 2px; font-size: 13px; }
    .chip span { color: #c5221f; cursor: pointer; margin-left: 6px; font-weight: bold; }
    #sampleInput { width: 140px; }
    .hidden { display: none; }
    table.diff { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    table.diff td { padding: 4px 6px; border-bottom: 1px solid #eee; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 8px; padding: 20px; max-width: 520px; width: 90%; }
    .backlink { display:inline-block; margin-bottom:10px; font-size:14px; color:#1a73e8;
                text-decoration:none; }
    .backlink:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <a class="backlink" id="backLink" href="#">&larr; Menu</a>
  <h1>Échantillonnage — saisie lot</h1>

  <label for="lot">Lot</label>
  <select id="lot"><option value="">Chargement…</option></select>

  <div id="status"></div>
  <div id="form"></div>

  <script>

  // Back link -> menu (same web app URL, no ?screen parameter)
  google.script.run.withSuccessHandler(function (u) {
    var b = document.getElementById('backLink');
    if (b) b.href = u;
  }).getWebAppUrl();
    let loaded = null;      // last uiLoadLot result
    let newSamples = [];    // samples staged in the browser, not yet written
    let grossAll = [];      // all 4 grossissement sub-lot slots for the target block
    let grossVisible = 1;   // how many of them are currently shown

    // ---------- helpers ----------
    function el(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s === null || s === undefined ? "" : s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function setStatus(cls, html) { el('status').innerHTML = html ? '<div class="'+cls+'">'+html+'</div>' : ''; }
    /**
     * Parse a number accepting BOTH decimal comma and decimal point.
     * The sheet is French-locale, so values arrive as "0,45"; plain
     * Number("0,45") is NaN, which would silently drop the value.
     */
    function num(v) {
      if (v === null || v === undefined) return null;
      const s = String(v).trim().replace(',', '.');
      if (s === '') return null;
      const n = Number(s);
      return isFinite(n) ? n : null;
    }
    /**
     * Display-only number formatting for sheet-owned values. The sheet
     * stores full float precision (Lot-31 16-21!D11 = 7517.381341447861);
     * a worker needs a rounded value with a French comma.
     * Never used on a value that will be written back.
     */
    function fmtNum(v, dec) {
      const n = num(v);
      return n === null ? null : n.toFixed(dec).replace('.', ',');
    }
    /**
     * A field the SHEET owns: label plus grey text, no input.
     * Rendering no input is the point — collectPayload only reads
     * [data-field] elements, so a read-only field cannot be sent, and
     * the screen therefore cannot disagree with the server.
     */
    function roField(label, value, dec) {
      const n = fmtNum(value, dec);
      return '<label>' + esc(label) + '</label>' +
        '<div class="muted">' + esc(n === null ? '—' : n) + ' (calculé par la feuille)</div>';
    }

    // ---------- lot list ----------
    google.script.run
      .withSuccessHandler(list => {
        el('lot').innerHTML = '<option value="">-- choisir un lot --</option>' +
          list.map(l => '<option value="'+esc(l.fileId)+'">'+esc(l.fileName)+'</option>').join('');
      })
      .withFailureHandler(e => setStatus('err', 'Erreur chargement lots : ' + esc(e.message)))
      .uiGetLotList();

    el('lot').addEventListener('change', function () {
      const fileId = this.value;
      el('form').innerHTML = '';
      newSamples = [];
      loaded = null;
      if (!fileId) { setStatus('', ''); return; }
      setStatus('banner', 'Chargement du lot…');
      google.script.run
        .withSuccessHandler(onLotLoaded)
        .withFailureHandler(e => setStatus('err', 'Erreur : ' + esc(e.message)))
        .uiLoadLot(fileId);
    });

    function onLotLoaded(data) {
      loaded = data;
      if (data.stage === 'none') { setStatus('err', esc(data.reason)); return; }
      const where = (data.stage === 'grossissement')
        ? 'Grossissement · bloc du <b>' + esc(data.fields.date || '(date à saisir)') + '</b>'
        : 'onglet <b>' + esc(data.tabName) + '</b>';
      let banner = '<div class="banner"><b>' + esc(currentLotName()) + '</b> · ' + where + '</div>';
      if (data.mixedWarning) banner += '<div class="warn">' + esc(data.mixedWarning) + '</div>';
      el('status').innerHTML = banner;

      el('form').innerHTML = renderForm(data);
      wireSampleInput();
      if (data.kind === 'grossissement') renderGrossAddButton();
    }

    function currentLotName() {
      const sel = el('lot');
      return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
    }

    // ---------- form rendering ----------
    function renderForm(d) {
      const f = d.fields;
      let html = '';

      if (d.kind === 'early') {
        if (f.B1 !== undefined) {
          html += '<div class="card"><h3>Identité du lot</h3>' +
            field('B1', 'Numéro de lot', f.B1, 'text') +
            '<div class="row"><div>' + field('B2', 'Bassin', f.B2, 'text') + '</div>' +
            '<div>' + field('B3', 'Happa', f.B3, 'text') + '</div></div>' +
            field('B5', 'Date de départ', f.B5, 'date') +
            '</div>';
        }
        // The three quantities, in sheet order B11 / C11 / D11.
        // Ownership (field-ownership contract, 2026-08-16 §3.4):
        //   Nombre B11       formula on EVERY early tab   -> sheet-owned
        //   Poids moyen C11  sample average on every tab   -> sheet-owned
        //   Biomasse D11     input on 1-5 only;
        //                    =C11*B11 on 6-10/11-15/16-21  -> sheet-owned
        // Since 2026-08-17 the server writes D11 only on 1-5 and silently
        // ignores it elsewhere (LotWrite.js, commit 6fb1069). Rendering an
        // input there invited a worker to type a value that did nothing.
        html += '<div class="card"><h3>Mesures</h3>' +
          field('B4', "Température de l'eau (°C)", f.B4, 'number') +
          roField('Nombre', f.B11, 0) +
          roField('Poids moyen (g)', f.C11, 2) +
          (d.tabName === '1-5'
            ? field('D11', 'Biomasse (g)', f.D11, 'number')
            : roField('Biomasse (g)', f.D11, 1)) +
          field('G11', 'Commentaires', f.G11, 'text') +
          '</div>';
        html += renderSamples(f.samples);
      }

      else if (d.kind === 's1') {
        // S1 owns none of the three: B11 mirrors '1-5'!B11, C11 is the
        // sample average (=K55), D11 is derived. Poids moyen changes only
        // through the sample cells below. Comments are H11 on S1, not G11.
        html += '<div class="card"><h3>Mesures</h3>' +
          field('B4', "Température de l'eau (°C)", f.B4, 'number') +
          roField('Nombre', f.B11, 0) +
          roField('Poids moyen (g)', f.C11, 2) +
          roField('Biomasse (g)', f.D11, 1) +
          field('H11', 'Commentaires', f.H11, 'text') +
          '</div>';
        html += renderSamples(f.samples);
      }

      else if (d.kind === 's3plus') {
        // Bassin/Happa for the three sub-lots, laid out exactly as on
        // S2-Tri. The screen previously showed only sub-lot 1 (B2/B3),
        // so C2/D2/C3/D3 could not be recorded from the app at all.
        html += '<div class="card"><h3>Conditions</h3>' +
          field('B4', "Température de l'eau (°C)", f.B4, 'number') +
          '<div class="muted" style="margin-top:10px">Bassin / Happa par sous-lot :</div>' +
          '<div class="row">' +
            '<div>' + field('B2', 'Bassin 1', f.B2, 'text') + field('B3', 'Happa 1', f.B3, 'text') + '</div>' +
            '<div>' + field('C2', 'Bassin 2', f.C2, 'text') + field('C3', 'Happa 2', f.C3, 'text') + '</div>' +
            '<div>' + field('D2', 'Bassin 3', f.D2, 'text') + field('D3', 'Happa 3', f.D3, 'text') + '</div>' +
          '</div></div>';
        html += renderSubLots(f.subLots, 's3plus');
      }

      else if (d.kind === 's2-tri') {
        html += '<div class="card"><h3>Tri</h3>' +
          field('B7', 'Date de tri', f.B7, 'date') +
          field('B4', "Température de l'eau (°C)", f.B4, 'number') +
          '<div class="muted" style="margin-top:10px">Bassin / Happa par sous-lot :</div>' +
          '<div class="row">' +
            '<div>' + field('B2', 'Bassin 1', f.B2, 'text') + field('B3', 'Happa 1', f.B3, 'text') + '</div>' +
            '<div>' + field('C2', 'Bassin 2', f.C2, 'text') + field('C3', 'Happa 2', f.C3, 'text') + '</div>' +
            '<div>' + field('D2', 'Bassin 3', f.D2, 'text') + field('D3', 'Happa 3', f.D3, 'text') + '</div>' +
          '</div></div>';
        html += renderSubLots(f.subLots, 's2-tri');
      }

      else if (d.kind === 'grossissement') {
        html += '<div class="card"><h3>Bloc de pesée</h3>' +
          field('date', 'Date de la pesée', f.date, 'date') +
          field('temperature', "Température de l'eau (°C)", f.temperature, 'number') +
          '<div class="muted">Ces deux valeurs s\'appliquent à tout le bloc.</div>' +
          '</div>';
        html += renderGrossSubLots(f.subLots);
      }

      html += '<button class="go" id="submitBtn" onclick="doPreview()">Enregistrer</button>';
      return html;
    }

    function field(key, label, value, type) {
      let v = (value === null || value === undefined) ? '' : value;
      if (type === 'number' && v !== '') { const p = num(v); if (p !== null) v = p; }
      return '<label>' + esc(label) + '</label>' +
        '<input type="' + type + '" data-field="' + key + '" value="' + esc(v) + '"' +
        (type === 'number' ? ' step="any"' : '') + '>';
    }

    /**
     * Only sub-lots with a real label are shown. Rows 13-16 are usually
     * blank template rows — rendering six empty cards would be noise.
     */
    function renderSubLots(subLots, kind) {
      const live = (subLots || []).filter(s => String(s.label || '').trim() !== '');
      if (!live.length) return '<div class="warn">Aucun sous-lot actif sur cet onglet.</div>';

      return live.map(s => {
        let inner = '';
        if (kind === 's3plus') {
          inner =
            '<div class="row">' +
              '<div>' + subField(s.row, 'nombre', 'Nombre', s.nombre) + '</div>' +
              '<div>' + subField(s.row, 'poidsMoyen', 'Poids moyen (g)', s.poidsMoyen) + '</div>' +
            '</div>' +
            subField(s.row, 'commentaire', 'Commentaires', s.commentaire, 'text') +
            '<div class="muted">Biomasse (calculée) : ' + esc(s.biomasse) + '</div>';
        } else { // s2-tri
          inner =
            '<div class="row">' +
              '<div>' + subField(s.row, 'poidsMoyen', 'Poids moyen (g)', s.poidsMoyen) + '</div>' +
              '<div>' + subField(s.row, 'biomasse', 'Biomasse', s.biomasse) + '</div>' +
            '</div>' +
            subField(s.row, 'commentaire', 'Commentaires', s.commentaire, 'text') +
            '<div class="muted">Nombre (calculé) : ' + esc(s.nombre) + '</div>';
        }
        return '<div class="card"><h3>' + esc(s.label) +
          ' <span class="muted">ligne ' + s.row + '</span></h3>' + inner + '</div>';
      }).join('');
    }

    function subField(row, key, label, value, type) {
      let v = (value === null || value === undefined) ? '' : value;
      if ((type || 'number') === 'number' && v !== '') { const p = num(v); if (p !== null) v = p; }
      return '<label>' + esc(label) + '</label>' +
        '<input type="' + (type || 'number') + '" step="any" data-sub-row="' + row +
        '" data-sub-key="' + key + '" value="' + esc(v) + '">';
    }

    /**
     * Grossissement: up to 4 sub-lots per block, one per COLUMN (not
     * row). All four are shown — unlike S-tabs, the target block is
     * empty by design, so there are no labels to filter on. Staff fill
     * as many as the lot actually has.
     */
    function renderGrossSubLots(subLots) {
      const all = subLots || [];
      // Show a card for each sub-lot that already has data, but at
      // least one. The rest are added on demand — most lots have a
      // single sub-lot and four empty cards invite mis-keying.
      const withData = all.filter(s =>
        String(s.bassin || '') !== '' || String(s.happa || '') !== '' ||
        String(s.nombre || '') !== '' || String(s.poidsMoyen || '') !== '');
      grossVisible = Math.max(1, withData.length);
      grossAll = all;
      return '<div id="grossCards">' + grossCardsHtml() + '</div>' +
             '<div id="grossAddWrap"></div>';
    }

    function grossCardsHtml() {
      return grossAll.slice(0, grossVisible).map((s, i) =>
        '<div class="card"><h3>Sous-lot ' + (i + 1) +
          ' <span class="muted">colonne ' + s.col + '</span></h3>' +
          '<div class="row">' +
            '<div>' + grossField(s.col, 'bassin', 'Bassin/Cage', s.bassin, 'text') + '</div>' +
            '<div>' + grossField(s.col, 'happa', 'Happa/Carré/Rond', s.happa, 'text') + '</div>' +
          '</div>' +
          '<div class="row">' +
            '<div>' + grossField(s.col, 'nombre', 'Nombre', s.nombre) + '</div>' +
            '<div>' + grossField(s.col, 'poidsMoyen', 'Poids moyen (g)', s.poidsMoyen) + '</div>' +
          '</div>' +
        '</div>'
      ).join('');
    }

    /**
     * Re-render adds a card without losing what is already typed, by
     * saving current input values first and restoring them after.
     */
    function addGrossSubLot() {
      if (grossVisible >= grossAll.length) return;
      const saved = {};
      document.querySelectorAll('[data-gross-col]').forEach(inp => {
        saved[inp.getAttribute('data-gross-col') + '|' + inp.getAttribute('data-gross-key')] = inp.value;
      });
      grossVisible++;
      document.getElementById('grossCards').innerHTML = grossCardsHtml();
      document.querySelectorAll('[data-gross-col]').forEach(inp => {
        const k = inp.getAttribute('data-gross-col') + '|' + inp.getAttribute('data-gross-key');
        if (saved[k] !== undefined) inp.value = saved[k];
      });
      renderGrossAddButton();
    }

    function renderGrossAddButton() {
      const wrap = document.getElementById('grossAddWrap');
      if (!wrap) return;
      wrap.innerHTML = (grossVisible < grossAll.length)
        ? '<button class="primary" style="margin-top:12px" onclick="addGrossSubLot()">+ Ajouter un sous-lot</button>'
        : '<div class="muted" style="margin-top:12px">Maximum de ' + grossAll.length + ' sous-lots atteint.</div>';
    }

    function grossField(col, key, label, value, type) {
      let v = (value === null || value === undefined) ? '' : value;
      const t = type || 'number';
      if (t === 'number' && v !== '') { const p = num(v); if (p !== null) v = p; }
      return '<label>' + esc(label) + '</label>' +
        '<input type="' + t + '"' + (t === 'number' ? ' step="any"' : '') +
        ' data-gross-col="' + col + '" data-gross-key="' + key + '" value="' + esc(v) + '">';
    }

    /**
     * Samples are APPEND-ONLY server-side, so existing values are shown
     * as read-only context and never re-sent. Only newly typed values
     * are submitted.
     */
    function renderSamples(s) {
      if (!s) return '';
      if (s.full) {
        return '<div class="card"><h3>Échantillonnage</h3>' +
          '<div class="ok">Échantillonnage complet (' + s.used + '/' + s.capacity +
          ') — terminé pour cette période.</div></div>';
      }
      return '<div class="card"><h3>Échantillonnage ' +
        '<span class="muted">' + s.used + '/' + s.capacity + ' déjà saisis · ' +
        s.remaining + ' place(s) libre(s)</span></h3>' +
        '<div class="row" style="align-items:flex-end">' +
          '<div style="flex:0 0 160px"><label>Poids (g)</label>' +
          '<input type="number" step="any" id="sampleInput" placeholder="ex: 14.5"></div>' +
          '<div style="flex:0 0 auto"><button class="primary" onclick="addSample()">Ajouter</button></div>' +
          '<div id="sampleStats" class="muted"></div>' +
        '</div>' +
        '<div class="samples" id="sampleList"></div></div>';
    }

    // ---------- samples ----------
    function wireSampleInput() {
      const inp = el('sampleInput');
      if (!inp) return;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addSample(); } });
      inp.focus();
      renderSampleList();
    }

    function addSample() {
      const inp = el('sampleInput');
      const v = num(inp.value);
      if (v === null || v <= 0) { setStatus('err', 'Poids invalide.'); return; }

      const s = loaded.fields.samples;
      if (newSamples.length >= s.remaining) {
        setStatus('err', 'Plus de place : ' + s.remaining + ' emplacement(s) libre(s) seulement.');
        return;
      }
      newSamples.push(v);
      inp.value = '';
      inp.focus();
      setStatus('banner', '<b>' + esc(currentLotName()) + '</b> · onglet <b>' + esc(loaded.tabName) + '</b>');
      renderSampleList();
    }

    function removeSample(i) { newSamples.splice(i, 1); renderSampleList(); }

    function renderSampleList() {
      const list = el('sampleList');
      if (!list) return;
      list.innerHTML = newSamples.map((v, i) =>
        '<span class="chip">' + esc(v) + '<span onclick="removeSample(' + i + ')">×</span></span>'
      ).join('');

      const stats = el('sampleStats');
      if (stats) {
        if (!newSamples.length) { stats.textContent = ''; }
        else {
          const sum = newSamples.reduce((a, b) => a + b, 0);
          const avg = sum / newSamples.length;
          stats.textContent = newSamples.length + ' ajouté(s) · moyenne ' + avg.toFixed(2) + ' g';
        }
      }
    }

    // ---------- submit ----------
    function collectPayload() {
      const fields = {};
      document.querySelectorAll('[data-field]').forEach(inp => {
        const key = inp.getAttribute('data-field');
        const raw = inp.value;
        if (raw === '') return;                       // untouched/blank -> leave cell alone
        fields[key] = (inp.type === 'number') ? num(raw) : raw;
      });

      const byRow = {};
      document.querySelectorAll('[data-sub-row]').forEach(inp => {
        const row = Number(inp.getAttribute('data-sub-row'));
        const key = inp.getAttribute('data-sub-key');
        const raw = inp.value;
        if (raw === '') return;
        byRow[row] = byRow[row] || { row: row };
        byRow[row][key] = (inp.type === 'number') ? num(raw) : raw;
      });
      const subLots = Object.keys(byRow).map(r => byRow[r]);
      if (subLots.length) fields.subLots = subLots;

      const byCol = {};
      document.querySelectorAll('[data-gross-col]').forEach(inp => {
        const col = Number(inp.getAttribute('data-gross-col'));
        const key = inp.getAttribute('data-gross-key');
        const raw = inp.value;
        if (raw === '') return;
        byCol[col] = byCol[col] || { col: col };
        byCol[col][key] = (inp.type === 'number') ? num(raw) : raw;
      });
      const grossSubLots = Object.keys(byCol).map(k => byCol[k]);
      if (grossSubLots.length) fields.subLots = grossSubLots;

      if (newSamples.length) fields.samples = newSamples.slice();

      return { fields: fields };
    }

    function doPreview() {
      const btn = el('submitBtn');
      btn.disabled = true;
      setStatus('banner', 'Vérification…');

      google.script.run
        .withSuccessHandler(preview => {
          if (preview.changeCount === 0) {
            btn.disabled = false;
            setStatus('warn', 'Aucun changement à enregistrer.');
            return;
          }
          if (preview.needsConfirmation) { showConfirm(preview); btn.disabled = false; }
          else doSubmit();
        })
        .withFailureHandler(e => { btn.disabled = false; setStatus('err', esc(e.message)); })
        .uiPreviewSubmit(loaded.fileId, collectPayload());
    }

    function showConfirm(preview) {
      const rows = preview.overwrites.map(o =>
        '<tr><td>' + esc(o.note) + '</td><td>' + esc(o.from) + ' → <b>' + esc(o.to) + '</b></td></tr>'
      ).join('');
      const extra = preview.additions.length
        ? '<div class="muted" style="margin-top:8px">+ ' + preview.additions.length + ' nouvelle(s) saisie(s).</div>'
        : '';
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = '<div class="modal"><h3>Confirmer le remplacement</h3>' +
        '<div class="muted">Ces valeurs existent déjà et seront remplacées :</div>' +
        '<table class="diff">' + rows + '</table>' + extra +
        '<div style="margin-top:16px;text-align:right">' +
        '<button onclick="closeConfirm()" style="margin-right:8px">Annuler</button>' +
        '<button class="go" style="margin:0" onclick="closeConfirm(); doSubmit();">Confirmer</button>' +
        '</div></div>';
      bg.id = 'confirmBg';
      document.body.appendChild(bg);
    }

    function closeConfirm() {
      const bg = el('confirmBg');
      if (bg) bg.remove();
    }

    function doSubmit() {
      const btn = el('submitBtn');
      btn.disabled = true;
      setStatus('banner', 'Enregistrement…');

      google.script.run
        .withSuccessHandler(res => {
          setStatus('ok', res.changeCount + ' cellule(s) enregistrée(s).');
          newSamples = [];
          const fileId = loaded.fileId;
          google.script.run.withSuccessHandler(onLotLoaded).uiLoadLot(fileId); // reload fresh state
        })
        .withFailureHandler(e => { btn.disabled = false; setStatus('err', esc(e.message)); })
        .uiSubmit(loaded.fileId, collectPayload());
    }
  </script>
</body>
</html>
