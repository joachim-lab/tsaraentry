  <a class="backlink" id="backLink" href="#">&larr; Menu</a>
  <h1>Mouvements de lot</h1>

  <label for="lot" id="lotLabel">Lot</label>
  <select id="lot" onchange="refresh()"><option value="">Chargement...</option></select>

  <label for="op">Opération</label>
  <select id="op" onchange="refresh()"><option value="">Chargement...</option></select>

  <div id="srcBlock" style="display:none">
    <label for="src1">Le lot qui disparaît</label>
    <select id="src1" onchange="refresh()"><option value="">-- aucun --</option></select>
    <label for="src2">Le lot qui disparaît (optionnel)</label>
    <select id="src2" onchange="refresh()"><option value="">-- aucun --</option></select>
  </div>

  <button id="goBtn" onclick="openForm()" disabled>Ouvrir le formulaire</button>
  <div id="msg"></div>

  <script>
    var BASE = '';
    var LOTS = [];

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    google.script.run.withSuccessHandler(function (u) {
      BASE = u;
      var b = document.getElementById('backLink');
      if (b) b.href = u;
      refresh();
    }).getWebAppUrl();

    google.script.run
      .withSuccessHandler(function (o) {
        LOTS = o.lots;
        fill('lot', o.lots.map(function (x) { return { v: x.fileId, t: 'Lot-' + x.lotNumber }; }));
        fill('op',  o.ops.map(function (x) { return { v: x.key, t: x.label }; }));
        fillSrc('src1'); fillSrc('src2');
        refresh();
      })
      .withFailureHandler(function (e) {
        showErr('Erreur de chargement : ' + esc(e.message));
      })
      .tracGetOptions();

    function fill(id, items) {
      document.getElementById(id).innerHTML =
        '<option value="">-- choisir --</option>' +
        items.map(function (i) {
          return '<option value="' + esc(i.v) + '">' + esc(i.t) + '</option>';
        }).join('');
    }

    /* The button stays disabled until BOTH lists are chosen AND the web
       app URL has arrived. Without BASE there is nowhere to navigate,
       and a click would silently do nothing. The operator is not tested
       here: if identity detection failed, tracGetOptions threw, the
       lists never filled, and the button can never enable. */
    function refresh() {
      var op = document.getElementById('op').value;
      var isMel = (op === 'melange');
      document.getElementById('srcBlock').style.display = isMel ? '' : 'none';
      document.getElementById('lotLabel').textContent =
        isMel ? 'Le lot qui reste' : 'Lot';
      var bad = '';
      if (isMel) {
        var recvNum = lotNumberFor(document.getElementById('lot').value);
        var s1 = document.getElementById('src1').value;
        var s2 = document.getElementById('src2').value;
        if (s1 && s1 === recvNum) bad = 'Le lot qui disparaît est le même que le lot qui reste.';
        else if (s2 && s2 === recvNum) bad = 'Le lot qui disparaît (2) est le même que le lot qui reste.';
        else if (s1 && s2 && s1 === s2) bad = 'Les deux lots qui disparaissent sont identiques.';
        else if (s2 && !s1) bad = 'Remplissez le premier lot qui disparaît avant le deuxième.';
      }
      var m = document.getElementById('msg');
      if (bad) { m.className = 'err'; m.innerHTML = esc(bad); }
      else { m.className = ''; m.innerHTML = ''; }
      var ready = BASE &&
        document.getElementById('lot').value &&
        op && !bad;
      document.getElementById('goBtn').disabled = !ready;
    }

    function lotNumberFor(fileId) {
      for (var i = 0; i < LOTS.length; i++)
        if (LOTS[i].fileId === fileId) return String(LOTS[i].lotNumber);
      return '';
    }

    /* Source dropdowns carry LOT NUMBERS (the form and the engine work
       by lot root), unlike the receiver dropdown which carries the
       fileId the Router needs to open the receiving lot file. */
    function fillSrc(id) {
      document.getElementById(id).innerHTML =
        '<option value="">-- aucun --</option>' +
        LOTS.map(function (x) {
          return '<option value="' + esc(String(x.lotNumber)) + '">Lot-' + esc(x.lotNumber) + '</option>';
        }).join('');
    }

    /* Navigate rather than inject. The form is a complete HTML document
       with its own script; HTML inserted into a live page does not run
       its scripts, so an injected form would render but be dead. Served
       as its own page by the Router, it behaves normally. */
    function openForm() {
      var url = BASE +
        '?screen=tracform' +
        '&lot=' + encodeURIComponent(document.getElementById('lot').value) +
        '&op='  + encodeURIComponent(document.getElementById('op').value);
      if (document.getElementById('op').value === 'melange') {
        var src = [];
        var a = document.getElementById('src1').value;
        var b = document.getElementById('src2').value;
        if (a) src.push(a);
        if (b) src.push(b);
        if (src.length) url += '&src=' + encodeURIComponent(src.join(','));
      }
      busyGo(url);
    }

    function showErr(html) {
      var m = document.getElementById('msg');
      m.className = 'err';
      m.innerHTML = html;
    }
  </script>
</body>
</html>
