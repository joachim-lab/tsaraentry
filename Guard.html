<!-- Guard.html - shared unsaved-changes guard for every TSARA Entry screen
     that saves. Each screen includes it once, immediately after Spinner:
         <?!= include('Guard'); ?>

     It marks the page dirty when the user edits any field, and clears the
     mark when a WRITE server call succeeds. Leaving the page while dirty
     shows an in-page dialog - not the browser's confirm(), which carries an
     "An embedded page at ... says" header no page can remove.

     A screen that changes state WITHOUT a field edit (a programmatic fill,
     a select-all) calls tsaraGuardMark() itself.

     Excluded on purpose: Menu, GestionInventaires (no fields), Tracabilite
     (its button is meant to navigate away; nothing is lost). -->
<style>
  #tsGuard { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45); z-index: 100001; align-items: center; justify-content: center; }
  #tsGuard.on { display: flex; }
  #tsGuard .gBox { background: #fff; border-radius: 8px; padding: 20px 24px; max-width: 440px;
    margin: 0 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  #tsGuard p { margin: 0 0 10px; font-size: 18px; color: #c5221f; font-weight: bold; }
  #tsGuard button { font-size: 17px; padding: 10px 16px; margin-right: 10px; cursor: pointer; }
  #tsGuard .gStay { background: #f1f3f4; color: #202124; border: 1px solid #ccc; border-radius: 4px; }
  #tsGuard .gGo { background: #c5221f; color: #fff; border: none; border-radius: 4px; }
</style>

<script>
(function () {
  // Server calls that WRITE. A successful one means the screen is saved.
  var WRITE = {
    submitNourrissage: 1, corrApply: 1, saveReduction: 1,
    submitAchats: 1, submitCheckStock: 1, submitInventaire: 1,
    completeInventaireReception: 1, mortsSubmit: 1,
    creerCreateLot: 1, creerCreateLotWithCarry: 1, creerArchiveLot: 1, carryClear: 1,
    dabSave: 1, tempSave: 1, uiSubmit: 1, carrySet: 1,
    cmdCreateOrder: 1, cmdModifyOrder: 1, cmdCancelOrder: 1, cmdRecordFulfilment: 1,
    cmdUpdateDelivery: 1, cmdUpdateOrderPrices: 1, cmdWhatsappMarkSent: 1,
    crmClientAdd: 1, crmSaveInfo: 1, grSetBlock: 1,
    demAdd: 1, demUpdate: 1, demDelete: 1, demSetOrder: 1,
    recAdd: 1, recUpdate: 1, recDelete: 1,
    resAdd: 1, resUpdate: 1, resDelete: 1
  };

  var dirty = false;
  var node = null;
  var pendingHref = null;

  window.tsaraGuardMark = function () { dirty = true; };
  window.tsaraGuardClear = function () { dirty = false; };
  window.tsaraGuardDirty = function () { return dirty; };

  document.addEventListener('DOMContentLoaded', function () {
    node = document.createElement('div');
    node.id = 'tsGuard';
    node.innerHTML =
      '<div class="gBox">' +
        "<p>Attention, vos changements n'ont pas \u00e9t\u00e9 sauv\u00e9s.</p>" +
        '<p>Continuer sans sauver ?</p>' +
        '<button type="button" class="gStay">Annuler</button>' +
        '<button type="button" class="gGo">Continuer sans sauver</button>' +
      '</div>';
    document.body.appendChild(node);
    node.querySelector('.gStay').addEventListener('click', function () {
      pendingHref = null;
      node.classList.remove('on');
    });
    node.querySelector('.gGo').addEventListener('click', function () {
      var h = pendingHref;
      pendingHref = null;
      dirty = false;
      node.classList.remove('on');
      if (!h) { return; }
      if (window.busyGo) { window.busyGo(h); } else { window.top.location.href = h; }
    });
  });

  // Any field the user touches marks the page.
  function onEdit(ev) {
    var t = ev.target;
    if (!t || !t.tagName) { return; }
    var tag = t.tagName.toLowerCase();
    if (tag !== 'input' && tag !== 'select' && tag !== 'textarea') { return; }
    if (t.hasAttribute('data-noguard')) { return; }
    if (t.readOnly || t.disabled) { return; }
    dirty = true;
  }
  document.addEventListener('input', onEdit, true);
  document.addEventListener('change', onEdit, true);

  // Link clicks while dirty. The navigation is cancelled synchronously here,
  // at the WINDOW capture phase - ahead of Spinner.html's document handler,
  // so Annuler can never leave the busy wheel turning.
  window.addEventListener('click', function (ev) {
    if (!dirty || !node) { return; }
    if (ev.button !== 0) { return; }
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) { return; }
    var a = ev.target;
    while (a && a.tagName !== 'A') { a = a.parentElement; }
    if (!a) { return; }
    var href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#') { return; }
    if (href.indexOf('javascript:') === 0 || href.indexOf('blob:') === 0) { return; }
    if (a.hasAttribute('download')) { return; }
    if (a.target && a.target !== '_top' && a.target !== '_self') { return; }
    ev.preventDefault();
    ev.stopPropagation();
    pendingHref = href;
    node.classList.add('on');
  }, true);

  // Backstop for tab close and reload. The browser imposes its own wording.
  window.addEventListener('beforeunload', function (e) {
    if (!dirty) { return; }
    e.preventDefault();
    e.returnValue = '';
  });

  // Wrap google.script.run (on top of Spinner's wrapper): a WRITE call that
  // succeeds clears the mark. `state` is shared along one chain, so the
  // success handler registered first still learns which method was called.
  function wrap(runner, state) {
    return new Proxy({}, {
      get: function (target, prop) {
        if (prop === 'withSuccessHandler') {
          return function (fn) {
            state.hasOk = true;
            return wrap(runner.withSuccessHandler(function () {
              if (state.write) { dirty = false; }
              if (fn) { fn.apply(this, arguments); }
            }), state);
          };
        }
        if (prop === 'withFailureHandler' || prop === 'withUserObject') {
          return function (arg) { return wrap(runner[prop](arg), state); };
        }
        return function () {
          state.write = !!WRITE[prop];
          var r = runner;
          if (state.write && !state.hasOk) {
            r = r.withSuccessHandler(function () { dirty = false; });
          }
          return r[prop].apply(r, arguments);
        };
      }
    });
  }

  var base = google.script.run;
  Object.defineProperty(google.script, 'run', {
    get: function () { return wrap(base, { write: false, hasOk: false }); },
    configurable: true
  });
}());
</script>
