<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    select, input { width: 100%; padding: 8px; font-size: 16px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; font-size: 15px; cursor: pointer; border: none; border-radius: 4px; }
    #addBtn { background: #1a73e8; color: white; }
    #submitBtn { background: #188038; color: white; }
    #submitBtn:disabled { background: #999; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    .del { color: #c00; cursor: pointer; font-weight: bold; }
    #msg { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
    #msg.ok { background: #e6f4ea; color: #188038; display: block; }
    #msg.err { background: #fce8e6; color: #c5221f; display: block; }
    #msg.warn { background: #fef7e0; color: #b06000; display: block; }
    #loading { display: none; color: #666; margin-top: 8px; }
    .backlink { display:inline-block; margin-bottom:10px; font-size:14px; color:#1a73e8; text-decoration:none; }
    .backlink:hover { text-decoration:underline; }
    .avail { margin-top: 6px; padding: 8px 10px; border-radius: 4px; font-size: 14px; font-weight: bold; }
    .avail.ok    { background: #e6f4ea; color: #188038; }
    .avail.block { background: #fce8e6; color: #c5221f; border-left: 4px solid #c5221f; }
    .avail.warn  { background: #fef7e0; color: #b06000; }
  </style>
</head>
<body>
  <a class="backlink" id="backLink" href="#">&larr; Menu</a>
  <h1>Mortalité</h1>

  <label for="lot">Lot</label>
  <select id="lot" onchange="onLotChange()"><option value="">Chargement...</option></select>
  <div id="avail"></div>

  <label for="date">Date</label>
  <input type="date" id="date">

  <label for="qty">Quantité morte</label>
  <input type="number" id="qty" min="1" step="1" placeholder="ex: 25">

  <label for="cause">Cause (optionnel)</label>
  <input type="text" id="cause" placeholder="ex: maladie, prédateur...">

  <button id="addBtn" onclick="addRow()">+ Ajouter à la liste</button>

  <table id="pending" style="display:none">
    <thead><tr><th>Lot</th><th>Date</th><th>Qté</th><th>Cause</th><th></th></tr></thead>
    <tbody id="pendingBody"></tbody>
  </table>

  <button id="submitBtn" onclick="submitAll()" disabled>Enregistrer (0)</button>
  <div id="loading">Enregistrement en cours...</div>
  <div id="msg"></div>

  <script>

  google.script.run.withSuccessHandler(function (u) {
    var b = document.getElementById('backLink');
    if (b) b.href = u;
  }).getWebAppUrl();

    let pending = [];
    let AVAIL_CACHE = {}; // lot -> last availability result, avoids re-fetching on every change

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    document.getElementById('date').value = todayISO();

    google.script.run.withSuccessHandler(function (o) {
      const sel = document.getElementById('lot');
      sel.innerHTML = '<option value="">-- choisir --</option>' +
        o.lots.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
    }).withFailureHandler(e => showMsg('err', 'Erreur chargement lots: ' + e.message))
      .mortsGetOptions();

    function onLotChange() {
      const lot = document.getElementById('lot').value;
      const div = document.getElementById('avail');
      if (!lot) { div.innerHTML = ''; return; }

      if (AVAIL_CACHE[lot]) { renderAvail(AVAIL_CACHE[lot]); return; }

      div.innerHTML = '<div class="avail warn">Vérification du stock...</div>';
      google.script.run
        .withSuccessHandler(a => { AVAIL_CACHE[lot] = a; renderAvail(a); })
        .withFailureHandler(e => { div.innerHTML = '<div class="avail block">Erreur: ' + esc(e.message) + '</div>'; })
        .mortsGetLotAvailability(lot);
    }

    function renderAvail(a) {
      const div = document.getElementById('avail');
      if (!a.found) {
        div.innerHTML = '<div class="avail warn">Lot non trouvé dans le fichier lot — l\'entrée sera signalée cette nuit.</div>';
        return;
      }
      div.innerHTML = '<div class="avail ok">Disponible : ' + a.available + ' poissons' +
        (a.pending ? ' (stock ' + a.count + ', déjà en attente ' + a.pending + ')' : '') + '</div>';
    }

    function addRow() {
      const lot = document.getElementById('lot').value;
      const date = document.getElementById('date').value;
      const qty = document.getElementById('qty').value;
      const cause = document.getElementById('cause').value;

      if (!lot || !date || !qty || Number(qty) <= 0) {
        showMsg('err', 'Merci de remplir lot, date et quantité (> 0).');
        return;
      }

      pending.push({ lot, date, qty, cause });
      document.getElementById('qty').value = '';
      document.getElementById('cause').value = '';
      hideMsg();
      renderPending();
    }

    function removeRow(i) {
      pending.splice(i, 1);
      renderPending();
    }

    function renderPending() {
      const table = document.getElementById('pending');
      const body = document.getElementById('pendingBody');
      const submitBtn = document.getElementById('submitBtn');

      if (pending.length === 0) {
        table.style.display = 'none';
      } else {
        table.style.display = '';
        body.innerHTML = pending.map((p, i) =>
          '<tr><td>' + esc(p.lot) + '</td><td>' + esc(p.date) + '</td><td>' + esc(p.qty) + '</td><td>' + esc(p.cause) + '</td>' +
          '<td class="del" onclick="removeRow(' + i + ')">✕</td></tr>'
        ).join('');
      }
      submitBtn.disabled = pending.length === 0;
      submitBtn.textContent = 'Enregistrer (' + pending.length + ')';
    }

    /** Server-side block/warn check across the WHOLE pending batch, then save if clean. */
    function submitAll() {
      if (!pending.length) return;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      hideMsg();
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').textContent = 'Vérification du stock...';

      google.script.run
        .withSuccessHandler(v => {
          if (v.blocks && v.blocks.length) {
            document.getElementById('loading').style.display = 'none';
            btn.disabled = false;
            showMsg('err', 'Non enregistré :<ul><li>' + v.blocks.map(esc).join('</li><li>') + '</li></ul>');
            return;
          }
          doSubmit(v.warnings || []);
        })
        .withFailureHandler(e => {
          document.getElementById('loading').style.display = 'none';
          btn.disabled = false;
          showMsg('err', 'Vérification du stock impossible: ' + esc(e.message));
        })
        .mortsValidateEntries(pending);
    }

    function doSubmit(warns) {
      document.getElementById('loading').textContent = 'Enregistrement en cours...';
      google.script.run
        .withSuccessHandler(res => {
          document.getElementById('loading').style.display = 'none';
          const base = res.written + ' entrée(s) enregistrée(s).';
          const m = document.getElementById('msg');
          m.className = warns.length ? 'warn' : 'ok';
          m.style.display = 'block';
          m.innerHTML = base + (warns.length
            ? '<br>Attention :<ul><li>' + warns.join('</li><li>') + '</li></ul>'
            : '');
          pending = [];
          AVAIL_CACHE = {};
          document.getElementById('avail').innerHTML = '';
          renderPending();
        })
        .withFailureHandler(e => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('submitBtn').disabled = false;
          showMsg('err', e.message);
        })
        .mortsSubmit(pending);
    }

    function showMsg(cls, html) {
      const m = document.getElementById('msg');
      m.className = cls;
      m.innerHTML = html;
    }
    function hideMsg() {
      const m = document.getElementById('msg');
      m.className = '';
      m.style.display = 'none';
    }
  </script>
</body>
</html>
