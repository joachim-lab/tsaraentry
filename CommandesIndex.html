<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; }
    select, input, textarea { padding: 8px; font-size: 15px; margin-top: 4px; box-sizing: border-box; width: 100%; }
    textarea { font-family: inherit; }
    button { padding: 9px 16px; font-size: 15px; cursor: pointer; border: none; border-radius: 4px; }
    .primary { background: #1a73e8; color: #fff; }
    .go { background: #188038; color: #fff; margin-top: 18px; }
    .go:disabled { background: #999; cursor: not-allowed; }
    .ghost { background: #f1f3f4; color: #202124; }
    .tabs { display: flex; gap: 8px; border-bottom: 2px solid #dadce0; margin-bottom: 8px; }
    .tab { padding: 10px 18px; cursor: pointer; font-size: 15px; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab.active { border-bottom-color: #1a73e8; color: #1a73e8; font-weight: bold; }
    .card { border: 1px solid #dadce0; border-radius: 6px; padding: 12px 14px; margin-top: 14px; }
    .card h3 { margin: 0 0 4px 0; font-size: 15px; }
    .muted { color: #5f6368; font-size: 12px; font-weight: normal; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .err  { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #fce8e6; color: #c5221f; font-size: 14px; }
    .ok   { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #e6f4ea; color: #188038; font-size: 14px; }
    .warn { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #fef7e0; color: #b06000; font-size: 13px; }
    .banner { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #e8f0fe; font-size: 14px; }
    .lineHead { display: flex; justify-content: space-between; align-items: center; }
    .del { color: #c5221f; cursor: pointer; font-size: 13px; }
    .hit { border: 1px solid #dadce0; border-radius: 6px; padding: 10px 12px; margin-top: 8px; cursor: pointer; }
    .hit:hover { background: #f8f9fa; }
    .hit.sel { border-color: #1a73e8; background: #e8f0fe; }
    .hit b { font-size: 14px; }
    .backlink { display:inline-block; margin-bottom:10px; font-size:14px; color:#1a73e8;
                text-decoration:none; }
    .backlink:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <a class="backlink" id="backLink" href="#">&larr; Menu</a>
  <h1>Commandes</h1>

  <div class="tabs">
    <div class="tab active" id="tabNew" onclick="switchMode('new')">Nouvelle commande</div>
    <div class="tab" id="tabFul" onclick="switchMode('ful')">Paiement &amp; livraison</div>
  </div>

  <div id="status"></div>
  <div id="paneNew"></div>
  <div id="paneFul" style="display:none"></div>

<script>

  // Back link -> menu (same web app URL, no ?screen parameter)
  google.script.run.withSuccessHandler(function (u) {
    var b = document.getElementById('backLink');
    if (b) b.href = u;
  }).getWebAppUrl();
  let OPTS = { lots: [], types: [] };
  let lines = [{}];            // create mode: one line per lot
  let mode = 'new';
  let hits = [];               // fulfilment search results
  let selectedKey = null;

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function setStatus(cls, html) { el('status').innerHTML = html ? '<div class="'+cls+'">'+html+'</div>' : ''; }
  function num(v) {
    if (v === null || v === undefined) return null;
    const s = String(v).trim().replace(',', '.');
    if (s === '') return null;
    const n = Number(s);
    return isFinite(n) ? n : null;
  }
  function todayISO() {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  // ---------- boot ----------
  google.script.run
    .withSuccessHandler(o => { OPTS = o; renderNew(); })
    .withFailureHandler(e => setStatus('err', 'Erreur chargement : ' + esc(e.message)))
    .cmdGetOptions();

  function switchMode(m) {
    mode = m;
    el('tabNew').className = 'tab' + (m === 'new' ? ' active' : '');
    el('tabFul').className = 'tab' + (m === 'ful' ? ' active' : '');
    el('paneNew').style.display = (m === 'new' ? '' : 'none');
    el('paneFul').style.display = (m === 'ful' ? '' : 'none');
    setStatus('', '');
    if (m === 'ful' && !el('ficherche')) renderFul();
  }

  // ---------- MODE A: new order ----------
  function renderNew() {
    const typeOpts = OPTS.types
      .filter(t => String(t).toLowerCase().indexOf('group') === -1)   // groupée is automatic
      .map(t => '<option value="'+esc(t)+'">'+esc(t)+'</option>').join('');

    el('paneNew').innerHTML =
      '<div class="card"><h3>Commande</h3>' +
        '<div class="row">' +
          '<div><label>Type</label><select id="fType" onchange="renderLines()">' +
            '<option value="">-- choisir --</option>' + typeOpts + '</select>' +
            '<div class="muted">AL = alevins · GR = poisson</div></div>' +
          '<div><label>Date commande</label><input type="date" id="fDate" value="'+todayISO()+'"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div><label>Client</label><input type="text" id="fClient"></div>' +
          '<div><label>Contact</label><input type="text" id="fContact"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div><label>N° facture</label><input type="text" id="fFacture"></div>' +
          '<div><label>Bon de livraison externe</label><input type="text" id="fBl"></div>' +
        '</div>' +
        '<label>Remarques / destination</label><input type="text" id="fRemarques">' +
      '</div>' +
      '<div id="linesWrap"></div>' +
      '<button class="primary" style="margin-top:12px" onclick="addLine()">+ Ajouter un lot</button>' +
      '<button class="go" id="btnCreate" onclick="doCreate()">Enregistrer la commande</button>';
    renderLines();
  }

  function isAlevins() {
    const t = (el('fType') && el('fType').value) || '';
    return t.toUpperCase().indexOf('AL') === 0;
  }

  function renderLines() {
    const wrap = el('linesWrap');
    if (!wrap) return;
    const t = (el('fType') && el('fType').value) || '';
    if (!t) { wrap.innerHTML = '<div class="warn">Choisir le type de commande en premier.</div>'; return; }

    const lotOpts = OPTS.lots.map(l => '<option value="'+esc(l)+'">'+esc(l)+'</option>').join('');
    const al = isAlevins();

    wrap.innerHTML = lines.map((ln, i) =>
      '<div class="card"><div class="lineHead"><h3>Lot ' + (i+1) + '</h3>' +
        (lines.length > 1 ? '<span class="del" onclick="removeLine('+i+')">Retirer</span>' : '') +
      '</div>' +
      '<label>Lot</label><select data-l="'+i+'" data-k="lot">' +
        '<option value="">-- choisir --</option>' + lotOpts + '</select>' +
      (al
        ? '<div class="row">' +
            '<div><label>Nombre alevins commandés</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="alevinsNb" oninput="syncLivrer('+i+')"></div>' +
            '<div><label>PM alevins (g)</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="alevinsPm"></div>' +
          '</div>' +
          '<div class="row">' +
            '<div><label>Alevins à livrer (+5%)</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="alevinsLivrer" id="livrer'+i+'">' +
              '<div class="muted">Pré-calculé à +5%, modifiable.</div></div>' +
            '<div><label>Prix alevin</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="alevinsPrix"></div>' +
          '</div>' +
          '<label>Prix transport</label>' +
          '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="transport">'
        : '<div class="row">' +
            '<div><label>Kg poisson commandé</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="poissonKg"></div>' +
            '<div><label>PM poisson (g)</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="poissonPm"></div>' +
          '</div>' +
          '<div class="row">' +
            '<div><label>Prix / kg</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="prixKg"></div>' +
            '<div><label>Frais additionnels</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="frais"></div>' +
          '</div>') +
      '</div>'
    ).join('');
    restoreLines();
  }

  /** Keep typed values across re-renders. */
  function stashLines() {
    document.querySelectorAll('[data-l]').forEach(inp => {
      const i = Number(inp.getAttribute('data-l'));
      const k = inp.getAttribute('data-k');
      lines[i] = lines[i] || {};
      lines[i][k] = inp.value;
    });
  }
  function restoreLines() {
    document.querySelectorAll('[data-l]').forEach(inp => {
      const i = Number(inp.getAttribute('data-l'));
      const k = inp.getAttribute('data-k');
      if (lines[i] && lines[i][k] !== undefined) inp.value = lines[i][k];
    });
  }

  function addLine() { stashLines(); lines.push({}); renderLines(); }
  function removeLine(i) { stashLines(); lines.splice(i, 1); renderLines(); }

  /** "+5%" default, still overridable. */
  function syncLivrer(i) {
    const nbInp = document.querySelector('[data-l="'+i+'"][data-k="alevinsNb"]');
    const lvInp = el('livrer'+i);
    if (!nbInp || !lvInp) return;
    const n = num(nbInp.value);
    if (n === null) return;
    if (!lvInp.dataset.touched) lvInp.value = Math.round(n * 1.05);
  }
  document.addEventListener('input', e => {
    if (e.target && e.target.id && e.target.id.indexOf('livrer') === 0) e.target.dataset.touched = '1';
  });

  function doCreate() {
    stashLines();
    const btn = el('btnCreate');
    btn.disabled = true;
    setStatus('banner', 'Enregistrement…');

    const al = isAlevins();
    const payload = {
      type: el('fType').value,
      dateCommande: el('fDate').value,
      client: el('fClient').value,
      contact: el('fContact').value,
      facture: el('fFacture').value,
      bl: el('fBl').value,
      remarques: el('fRemarques').value,
      lines: lines.map(ln => {
        const o = { lot: ln.lot || '' };
        if (al) {
          o.alevinsNb = num(ln.alevinsNb);
          o.alevinsPm = num(ln.alevinsPm);
          o.alevinsLivrer = num(ln.alevinsLivrer);
          o.alevinsPrix = num(ln.alevinsPrix);
          o.transport = num(ln.transport);
        } else {
          o.poissonKg = num(ln.poissonKg);
          o.poissonPm = num(ln.poissonPm);
          o.prixKg = num(ln.prixKg);
          o.frais = num(ln.frais);
        }
        return o;
      })
    };

    google.script.run
      .withSuccessHandler(res => {
        setStatus('ok', 'Commande <b>' + esc(res.orderNumber) + '</b> enregistrée — ' +
          res.rowCount + ' ligne(s), à partir de la ligne ' + res.firstRow + '.');
        lines = [{}];
        renderNew();
      })
      .withFailureHandler(e => { btn.disabled = false; setStatus('err', esc(e.message)); })
      .cmdCreateOrder(payload);
  }

  // ---------- MODE B: fulfilment ----------
  function renderFul() {
    el('paneFul').innerHTML =
      '<div class="card"><h3>Trouver une commande</h3>' +
        '<div class="row">' +
          '<div><label>Recherche (n° commande, client ou lot)</label>' +
            '<input type="text" id="ficherche" placeholder="ex: AL-26-155 ou Adelaiade"></div>' +
          '<div style="flex:0 0 220px"><label>&nbsp;</label>' +
            '<button class="primary" style="width:100%" onclick="doSearch()">Rechercher</button></div>' +
        '</div>' +
        '<label style="font-weight:normal"><input type="checkbox" id="fOnlyUnpaid" checked style="width:auto"> ' +
          'Seulement les commandes non soldées</label>' +
      '</div>' +
      '<div id="fulForm"></div>' +
      '<div id="hits"></div>';
    el('ficherche').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });

    // One delegated listener on the container: survives every re-render
    // of the results list, so nothing has to be re-attached.
    el('hits').addEventListener('click', function (ev) {
      const card = ev.target.closest ? ev.target.closest('.hit') : null;
      if (!card) return;
      const key = card.getAttribute('data-key');
      if (key) selectHit(key);
    });

    doSearch();
  }

  /**
   * keepMsg: {cls, html} to restore once the refreshed list has
   * rendered. Without it, a save confirmation set just before calling
   * doSearch() is wiped by this function's own status updates before
   * the user can read it.
   */
  function doSearch(keepMsg) {
    setStatus('banner', 'Recherche…');
    el('fulForm').innerHTML = '';
    selectedKey = null;
    google.script.run
      .withSuccessHandler(res => {
        hits = res;
        if (keepMsg) setStatus(keepMsg.cls, keepMsg.html); else setStatus('', '');
        el('hits').innerHTML = res.length
          ? res.map(o =>
              '<div class="hit" id="hit_'+esc(o.key)+'" data-key="'+esc(o.key)+'">' +
                '<b>' + esc(o.orderNumber || '(sans numéro)') + '</b> · ' + esc(o.client) +
                '<div class="muted">' + esc(o.dateCommande) + ' · lots : ' + esc(o.lots.join(', ') || '—') +
                ' · ligne(s) ' + o.rows.join(',') +
                (o.paiement ? ' · payé le ' + esc(o.paiement) : ' · non soldée') + '</div>' +
              '</div>').join('')
          : '<div class="warn">Aucune commande trouvée.</div>';
      })
      .withFailureHandler(e => setStatus('err', esc(e.message)))
      .cmdFindOrders(el('ficherche').value, el('fOnlyUnpaid').checked);
  }

  function selectHit(key) {
    selectedKey = key;
    hits.forEach(o => {
      const n = el('hit_' + o.key);
      if (n) n.className = 'hit' + (o.key === key ? ' sel' : '');
    });
    const o = hits.filter(h => h.key === key)[0];
    if (!o) return;

    el('fulForm').innerHTML =
      '<div class="card"><h3>' + esc(o.orderNumber || '(sans numéro)') + ' — ' + esc(o.client) + '</h3>' +
        '<div class="muted">Ces valeurs seront appliquées à toutes les lignes de la commande (' +
          o.rows.join(', ') + ').</div>' +
        '<div class="row">' +
          '<div><label>Paiement reçu le</label><input type="date" id="uPaiement" value="'+esc(toISO(o.paiement))+'"></div>' +
          '<div><label>Date livraison</label><input type="date" id="uLivraison" value="'+esc(toISO(o.dateLivraison))+'"></div>' +
        '</div>' +
        '<label>Moyen de paiement</label><input type="text" id="uMoyen" value="'+esc(o.moyenPaiement || '')+'">' +
        '<div class="row">' +
          '<div><label>N° facture</label><input type="text" id="uFacture" value="'+esc(o.facture || '')+'"></div>' +
          '<div><label>Bon de livraison externe</label><input type="text" id="uBl" value="'+esc(o.bl || '')+'"></div>' +
        '</div>' +
        '<button class="go" id="btnFul" onclick="doFulfil()">Enregistrer</button>' +
      '</div>';

    // The results list can be long; make sure the form is actually seen.
    const node = el('fulForm');
    if (node && node.scrollIntoView) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /** Sheet shows dd/MM/yyyy; date inputs need yyyy-MM-dd. */
  function toISO(d) {
    if (!d) return '';
    const m = String(d).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m ? m[3]+'-'+m[2]+'-'+m[1] : '';
  }

  function doFulfil() {
    const o = hits.filter(h => h.key === selectedKey)[0];
    if (!o) return;
    const btn = el('btnFul');
    btn.disabled = true;
    setStatus('banner', 'Enregistrement…');

    google.script.run
      .withSuccessHandler(res => {
        doSearch({
          cls: 'ok',
          html: res.changed.length
            ? res.changed.length + ' modification(s) enregistrée(s) sur ' + res.rows.length + ' ligne(s).'
            : 'Aucun changement.'
        });
      })
      .withFailureHandler(e => { btn.disabled = false; setStatus('err', esc(e.message)); })
      .cmdRecordFulfilment(o.rows, {
        paiement: el('uPaiement').value,
        dateLivraison: el('uLivraison').value,
        moyenPaiement: el('uMoyen').value,
        facture: el('uFacture').value,
        bl: el('uBl').value
      });
  }
</script>
</body>
</html>
