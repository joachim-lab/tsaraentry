<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    .tsaraLogo { position: fixed; top: 18px; right: 24px; height: 56px; width: auto; z-index: 500; }
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 24px; margin-bottom: 12px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 15px; }
    select, input, textarea { padding: 8px; font-size: 17px; margin-top: 4px; box-sizing: border-box; width: 100%; }
    textarea { font-family: inherit; }
    button { padding: 9px 16px; font-size: 17px; cursor: pointer; border: none; border-radius: 4px; }
    .primary { background: #1a73e8; color: #fff; }
    .go { background: #188038; color: #fff; margin-top: 18px; }
    .go:disabled { background: #999; cursor: not-allowed; }
    .ghost { background: #f1f3f4; color: #202124; }
    /* Six tabs on ONE line (Kim, 2026-08-31). At 820px body width the old
       18px side padding at 17px font measured ~970px, so Historique and
       Prix poisson wrapped to a second row. 9px padding, 15px font and a
       4px gap measure ~770px and fit.
       nowrap + overflow-x: a phone cannot fit six tabs at any readable
       size, so the bar scrolls sideways rather than wrapping. */
    .tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 4px;
            border-bottom: 2px solid #dadce0; margin-bottom: 8px; }
    .tab { padding: 10px 9px; cursor: pointer; font-size: 15px; white-space: nowrap;
           border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab.active { border-bottom-color: #1a73e8; color: #1a73e8; font-weight: bold; }
    /* Pré-commandes table: 9 columns plus 5 buttons per row does not fit
       the 820px body column, and clipping loses the button labels on the
       right. The wrapper breaks out of that column and centres itself on
       the viewport (margin-left 50% + translateX(-50%) against a body
       that is already centred), so the table gets the screen it needs on
       a laptop and scrolls sideways on a phone. The page body itself
       never scrolls horizontally. */
    .demWrap { overflow-x: auto; width: min(96vw, 1500px);
               margin-left: 50%; transform: translateX(-50%); }
    /* Row buttons: 17px is right for a form, far too wide for five of
       them in one cell. */
    .demBtn { padding: 5px 8px; font-size: 14px; background: #f1f3f4;
              color: #202124; }
    .demBtn:disabled { color: #9aa0a6; cursor: not-allowed; }
    /* Prix poisson tab: a read-only price list. Horizontal scroll on the
       wrapper, never on the page body - the fry grid is 7 columns. */
    .prixWrap { overflow-x: auto; }
    .prixTbl { border-collapse: collapse; width: 100%; font-size: 15px; }
    .prixTbl th, .prixTbl td { border: 1px solid #dadce0; padding: 6px 8px;
                               text-align: right; white-space: nowrap; }
    .prixTbl th { background: #f1f3f4; text-align: center; font-size: 13px; }
    .prixTbl td.cal { text-align: left; font-weight: bold; }
    .prixTbl td.pro { text-align: left; }
    .card { border: 1px solid #dadce0; border-radius: 6px; padding: 12px 14px; margin-top: 14px; }
    .card h3 { margin: 0 0 4px 0; font-size: 17px; }
    .totalAmount { font-size: 26px; font-weight: bold; color: #188038; }
    .muted { color: #5f6368; font-size: 14px; font-weight: normal; }
    /* Lot readout states. A blocking condition must not render in the same
       12px grey as an informational one - a reserved lot silently stops PM
       and price pre-fill, and that cause has to be visible (Kim 2026-08-12). */
    .availBlock { margin-top: 6px; padding: 8px 10px; border-radius: 4px;
                  background: #fce8e6; color: #c5221f; font-size: 17px;
                  font-weight: bold; border-left: 4px solid #c5221f; }
    .availWarn  { margin-top: 6px; padding: 8px 10px; border-radius: 4px;
                  background: #fef7e0; color: #b06000; font-size: 16px;
                  font-weight: bold; }
    /* The normal readout (disponible / PM / kg). Was .muted — 14px grey,
       the same style as a form hint, so the one number that decides the
       order read as decoration (Kim 2026-08-28). A disponible of 0 or
       less uses .availBlock instead: no quantity can be sold, which is a
       block, not information. */
    .availOk    { margin-top: 6px; padding: 8px 10px; border-radius: 4px;
                  background: #e6f4ea; color: #188038; font-size: 18px;
                  font-weight: bold; border-left: 4px solid #188038; }
    .row { display: flex; gap: 12px; flex-wrap: wrap }
    .row > div { flex: 1; min-width: 140px }
    .err  { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #fce8e6; color: #c5221f; font-size: 16px; }
    .ok   { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #e6f4ea; color: #188038; font-size: 16px; }
    .warn { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #fef7e0; color: #b06000; font-size: 15px; }
    .banner { margin-top: 10px; padding: 10px 12px; border-radius: 4px; background: #e8f0fe; font-size: 16px; }
    .lineHead { display: flex; justify-content: space-between; align-items: center; }
    .del { color: #c5221f; cursor: pointer; font-size: 15px; }
    .hit { border: 1px solid #dadce0; border-radius: 6px; padding: 10px 12px; margin-top: 8px; cursor: pointer; }
    .hit:hover { background: #f8f9fa; }
    .hit.sel { border-color: #1a73e8; background: #e8f0fe; }
    .hit b { font-size: 16px; }
    .backlink { display:inline-block; margin-bottom:10px; font-size: 16px; color:#1a73e8;
                text-decoration:none; }
    .backlink:hover { text-decoration:underline; }
      input[readonly], textarea[readonly], select[disabled] { background: #f1f3f4; color: #5f6368; }
  </style>
  <?!= include('Theme'); ?>
  <?!= include('Spinner'); ?>
</head>

<script>

  // Back link -> menu (same web app URL, no ?screen parameter)
  google.script.run.withSuccessHandler(function (u) {
    var b = document.getElementById('backLink');
    if (b) b.href = u;
  }).getWebAppUrl();
  let OPTS = { lots: [], types: [] };
  let TARIFS = null;           // { bands:[...], fish:{detail,gros} } - loaded once at boot
  let GATE = null;             // { pm:{key:PM}, fryMax, grBlock, grWarn } - lot/type gate
  // Sub-lots the lot file reports with no stock at all. Seeded at boot
  // from GATE.notSellable (the nightly map), then extended by any
  // selection that reveals one the map did not have - a lot file created
  // or emptied since the last rebuild. One set, two sources of entries.
  const NOT_SELLABLE = {};
  let GATE_FAILED = false;     // true once cmdGetLotGateData has thrown
  let lines = [{}];            // create mode: one line per lot
  let mode = 'new';
  let hits = [];               // fulfilment search results
  let selectedKey = null;

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function setStatus(cls, html) { el('status').innerHTML = html ? '<div class="'+cls+'">'+html+'</div>' : ''; }

  /**
   * Show a status message AND bring it into view. The Commandes form
   * is long enough that a confirmation set while the user is at the
   * bottom of the page is never seen.
   */
  function setStatusAndScroll(cls, html) {
    setStatus(cls, html);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function num(v) {
    if (v === null || v === undefined) return null;
    const s = String(v).trim().replace(',', '.');
    if (s === '') return null;
    const n = Number(s);
    return isFinite(n) ? n : null;
  }
  function todayISO() {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  // ---------- boot ----------
  google.script.run
    .withSuccessHandler(o => { OPTS = o; renderNew(); })
    .withFailureHandler(e => setStatus('err', 'Erreur chargement : ' + esc(e.message)))
    .cmdGetOptions();

  // Tarifs load independently of OPTS - price pre-fill is a nice-to-have,
  // never blocks the form. recomputeAllPrices() no-ops while TARIFS is null.
  google.script.run
    .withSuccessHandler(t => { TARIFS = t; recomputeAllPrices(); })
    .withFailureHandler(e => setStatus('warn', 'Tarifs indisponibles : ' + esc(e.message)))
    .cmdGetTarifs();

  // Lot/type gate data: one read of Stock Poisson, all lots at once.
  // If it fails the dropdown stays unfiltered AND says so - the per-lot
  // check at selection and the server check at save both still run.
  // Called at boot and again after every successful save.
  loadGateData();

  function loadGateData() {
  google.script.run
    .withSuccessHandler(g => {
      GATE = g;
      GATE_FAILED = false;
      showGateMsg();
      if (g && g.notSellable) {
        Object.keys(g.notSellable).forEach(k => { NOT_SELLABLE[k] = true; });
      }
      if (el('linesWrap')) renderLines();
    })
    .withFailureHandler(() => {
      GATE = null;
      GATE_FAILED = true;
      showGateMsg();
      if (el('linesWrap')) renderLines();
    })
    .cmdGetLotGateData();
  }

  /**
   * Say so when the gate data is missing. The form stays usable by
   * design - the per-lot readout and the server check at save both
   * still run - but a screen that drops its safety data silently
   * looks exactly like a screen that never had any. 2026-09-02.
   *
   * Written into its own line, not setStatus: a reload after a save
   * must not overwrite the order confirmation.
   */
  function showGateMsg() {
    const m = el('gateMsg');
    if (!m) return;                      // renderNew has not run yet
    if (!GATE_FAILED) { m.innerHTML = ''; return; }
    m.innerHTML = '<div class="warn">Donn\u00e9es de contr\u00f4le des lots ' +
      'indisponibles \u2014 poids, quantit\u00e9s et r\u00e9servations ne ' +
      'sont pas affich\u00e9s. La commande reste possible : le stock est ' +
      'v\u00e9rifi\u00e9 \u00e0 la s\u00e9lection du lot et \u00e0 ' +
      'l\'enregistrement. Pr\u00e9venir Kim.</div>';
  }

  function switchMode(m) {
    mode = m;
    el('tabNew').className = 'tab' + (m === 'new' ? ' active' : '');
    el('tabFul').className = 'tab' + (m === 'ful' ? ' active' : '');
    el('tabRes').className = 'tab' + (m === 'res' ? ' active' : '');
    el('tabDem').className = 'tab' + (m === 'dem' ? ' active' : '');
    el('tabHist').className = 'tab' + (m === 'hist' ? ' active' : '');
    el('tabPrix').className = 'tab' + (m === 'prix' ? ' active' : '');
    el('paneNew').style.display = (m === 'new' ? '' : 'none');
    el('paneFul').style.display = (m === 'ful' ? '' : 'none');
    el('paneRes').style.display = (m === 'res' ? '' : 'none');
    el('paneDem').style.display = (m === 'dem' ? '' : 'none');
    el('paneHist').style.display = (m === 'hist' ? '' : 'none');
    el('panePrix').style.display = (m === 'prix' ? '' : 'none');
    setStatus('', '');
    // 2026-08-30: refresh on EVERY visit, not only the first. The list
    // was built once and then only unhidden, so an order saved in the
    // Nouvelle commande tab did not appear here until a manual search.
    // Same rule as the Réservations tab below, for the same reason.
    if (m === 'ful') {
      if (!el('ficherche')) renderFul();
      else doSearch();
    }
    // Rebuilt on every visit, never cached: the tab is shared and a stale
    // list is exactly what would let two people fight over one hold.
    if (m === 'res') renderRes();
    if (m === 'dem') renderDem();
    if (m === 'hist') renderHist();
    if (m === 'prix') renderPrix();
    // Leaving the order form abandons any pending Commander hand-off.
    if (m !== 'new') pendingDem = null;
  }

  /* ---------- MODE F: Prix poisson (lecture seule) ----------
   *
   * Renders the SAME object the order form prices from, so the
   * displayed price and the charged price cannot disagree. No input,
   * no button: the price list belongs to Kim and a worker must never
   * be able to change it from this screen.
   *
   * Re-fetched on every visit, not read from the boot copy: a worker
   * opening this tab wants today's price, and the boot copy is as old
   * as the page. The refreshed TARIFS also benefits the order form.
   * The 5 min server cache makes the extra call nearly free.
   *
   * The Ambohimangakely transport rates are NOT shown here. They are
   * hardcoded in transportAmount() rather than read from the sheet,
   * so printing them would create a third home for the same number.
   */
  function renderPrix() {
    const pane = el('panePrix');
    pane.innerHTML = '<div class="banner">Chargement des tarifs…</div>';
    google.script.run
      .withSuccessHandler(t => { TARIFS = t; pane.innerHTML = prixHtml(t); })
      .withFailureHandler(e => {
        pane.innerHTML = '<div class="err">Tarifs indisponibles : ' +
                         esc(e.message) + '</div>';
      })
      .cmdGetTarifs();
  }

  /** A price, or an em dash. Never a bare 0 - a 0 price is not a price. */
  function prixAr(n) {
    return (n === null || n === undefined || !isFinite(n) || n <= 0)
      ? '\u2014' : fmtNum(n);
  }

  /** Build the read-only price tables from a cmdGetTarifs() result. */
  function prixHtml(t) {
    if (!t || !t.bands || !t.bands.length) {
      return '<div class="err">Liste de prix vide.</div>';
    }
    const g = n => String(n).replace('.', ',');
    let h = '';

    h += '<div class="card"><h3>Alevins &mdash; tilapia monosexe ' +
         '<span class="muted">(Ar / pi&egrave;ce)</span></h3>' +
         '<div class="prixWrap"><table class="prixTbl">' +
         '<tr><th>Calibre</th><th>Provende</th>' +
         '<th>Enl&egrave;vement<br>&agrave; la ferme</th>' +
         '<th>Environs ferme<br>&lt; 5000</th>' +
         '<th>Environs ferme<br>&gt; 5000</th>' +
         '<th>Ambohimangakely<br>&lt; 5000</th>' +
         '<th>Ambohimangakely<br>&gt; 5000</th></tr>';
    t.bands.forEach(b => {
      const cal = g(b.min) + ' - ' + g(b.max) + ' g';
      [['avec', 'Avec'], ['sans', 'Sans']].forEach((p, i) => {
        const v = b[p[0]] || {};
        h += '<tr>' +
             (i === 0 ? '<td rowspan="2" class="cal">' + esc(cal) + '</td>' : '') +
             '<td class="pro">' + p[1] + '</td>' +
             '<td>' + prixAr(v.enlevement) + '</td>' +
             '<td>' + prixAr(v.environsLe) + '</td>' +
             '<td>' + prixAr(v.environsGt) + '</td>' +
             '<td>' + prixAr(v.ambohimLe) + '</td>' +
             '<td>' + prixAr(v.ambohimGt) + '</td></tr>';
      });
    });
    h += '</table></div></div>';

    const f = t.fish || {};
    h += '<div class="card"><h3>Poisson grossi ' +
         '<span class="muted">(Ar / kg)</span></h3>' +
         '<div class="prixWrap"><table class="prixTbl">' +
         '<tr><th>D&eacute;tail</th><th>Gros</th></tr>' +
         '<tr><td>' + prixAr(f.detail) + '</td>' +
         '<td>' + prixAr(f.gros) + '</td></tr>' +
         '</table></div></div>';

    return h;
  }

  // ---------- MODE C: réservations ----------
  //
  // Reuses OPTS.lots (already loaded for the order form) - no extra server
  // call for the lot list. Server side enforces one hold per lot; the
  // dropdown greys held lots out so the error is rare rather than normal.
  //
  // Deletion arms on the first click and acts on the second, like order
  // cancellation. window.confirm() can be blocked inside this frame, which
  // would leave the button doing nothing at all, with no error.

  let resRows = [];   // last list from the server
  let resEdit = 0;    // row being edited; 0 = adding
  let resArmed = 0;   // row armed for deletion; 0 = none

  function renderRes() {
    el('paneRes').innerHTML =
      '<div id="resList">Chargement\u2026</div>' +
      '<div id="resForm"></div>';
    loadRes();
  }

  function loadRes() {
    google.script.run
      .withSuccessHandler(function (rows) {
        resRows = rows; resArmed = 0; drawResList(); drawResForm();
      })
      .withFailureHandler(function (e) {
        el('resList').innerHTML = '<div class="err">Erreur : ' + esc(e.message) + '</div>';
      })
      .resList();
  }

  function drawResList() {
    if (!resRows.length) {
      el('resList').innerHTML = '<div class="warn">Aucune r\u00e9servation.</div>';
      return;
    }
    var h = '<table style="width:100%;border-collapse:collapse;margin-bottom:20px">' +
      '<tr style="text-align:left;border-bottom:2px solid #dadce0">' +
      '<th style="padding:6px 8px">Lot</th>' +
      '<th style="padding:6px 8px">Type</th>' +
      '<th style="padding:6px 8px">Quantit\u00e9</th>' +
      '<th style="padding:6px 8px">Note</th>' +
      '<th style="padding:6px 8px"></th></tr>';
    resRows.forEach(function (r) {
      var armed = (resArmed === r.row);
      h += '<tr style="border-bottom:1px solid #e8eaed">' +
        '<td style="padding:6px 8px"><b>' + esc(r.lot) + '</b></td>' +
        '<td style="padding:6px 8px">' + esc(r.type) + '</td>' +
        '<td style="padding:6px 8px">' + (r.qty == null ? '' : fmtNum(r.qty)) + '</td>' +
        '<td style="padding:6px 8px">' + esc(r.note) + '</td>' +
        '<td style="padding:6px 8px;white-space:nowrap">' +
          '<button onclick="resStartEdit(' + r.row + ')">Modifier</button> ' +
          '<button onclick="resAskDelete(' + r.row + ')"' +
            (armed ? ' style="background:#d93025;color:#fff;border-color:#d93025"' : '') +
            '>' + (armed ? 'Confirmer \u2014 d\u00e9finitif' : 'Supprimer') + '</button>' +
        '</td></tr>';
    });
    el('resList').innerHTML = h + '</table>';
  }

  function drawResForm() {
    var cur = null;
    resRows.forEach(function (r) { if (r.row === resEdit) cur = r; });
    if (resEdit && !cur) resEdit = 0;          // row vanished under us

    // Lots that already carry a hold, excluding the one being edited.
    var held = {};
    resRows.forEach(function (r) { if (r.row !== resEdit) held[r.key] = true; });

    var opts = '<option value="">\u2014 choisir un lot \u2014</option>';
    OPTS.lots.forEach(function (l) {
      var k = canonKey(l);
      opts += '<option value="' + esc(l) + '"' +
              (held[k] ? ' disabled' : '') +
              (cur && cur.key === k ? ' selected' : '') + '>' +
              esc(l) + (held[k] ? ' \u2014 d\u00e9j\u00e0 r\u00e9serv\u00e9' : '') +
              '</option>';
    });

    var type = cur ? cur.type : 'TOUT';
    el('resForm').innerHTML =
      '<h3 style="margin:0 0 10px">' +
        (resEdit ? 'Modifier la r\u00e9servation' : 'Nouvelle r\u00e9servation') +
      '</h3>' +
      '<div style="margin-bottom:10px"><label>Lot<br><select id="rLot">' + opts + '</select></label></div>' +
      '<div style="margin-bottom:10px"><label>Type<br>' +
        '<select id="rType" onchange="resTypeChanged()">' +
        '<option value="TOUT"' + (type === 'TOUT' ? ' selected' : '') + '>Tout le lot</option>' +
        '<option value="NOMBRE"' + (type === 'NOMBRE' ? ' selected' : '') + '>Un nombre</option>' +
        '</select></label></div>' +
      '<div style="margin-bottom:10px" id="rQtyWrap"><label>Quantit\u00e9 (poissons)<br>' +
        '<input id="rQty" type="number" min="1" step="1" value="' +
        (cur && cur.qty != null ? cur.qty : '') + '"></label></div>' +
      '<div style="margin-bottom:12px"><label>Note<br>' +
        '<input id="rNote" type="text" size="50" value="' + esc(cur ? cur.note : '') + '"></label></div>' +
      '<button onclick="resSave()">' + (resEdit ? 'Enregistrer' : 'Ajouter') + '</button>' +
      (resEdit ? ' <button onclick="resCancelEdit()">Annuler</button>' : '');
    resTypeChanged();
  }

  function resTypeChanged() {
    var w = el('rQtyWrap');
    if (w) w.style.display = (el('rType').value === 'NOMBRE' ? '' : 'none');
  }

  function resStartEdit(row) {
    resEdit = row; resArmed = 0;
    drawResList(); drawResForm();
  }

  function resCancelEdit() {
    resEdit = 0; drawResForm();
  }

  function resSave() {
    var p = {
      lot:  el('rLot').value,
      type: el('rType').value,
      qty:  el('rQty') ? el('rQty').value : '',
      note: el('rNote').value
    };
    setStatus('banner', 'Enregistrement\u2026');
    if (resEdit) {
      var cur = null;
      resRows.forEach(function (r) { if (r.row === resEdit) cur = r; });
      p.row = resEdit;
      p.seenLot = cur ? cur.lot : '';
      google.script.run
        .withSuccessHandler(function () {
          resEdit = 0;
          setStatusAndScroll('ok', 'R\u00e9servation modifi\u00e9e.');
          loadRes();
        })
        .withFailureHandler(function (e) { setStatusAndScroll('err', esc(e.message)); })
        .resUpdate(p);
    } else {
      google.script.run
        .withSuccessHandler(function (r) {
          setStatusAndScroll('ok', 'R\u00e9servation ajout\u00e9e.');
          loadRes();
        })
        .withFailureHandler(function (e) { setStatusAndScroll('err', esc(e.message)); })
        .resAdd(p);
    }
  }

  function resAskDelete(row) {
    if (resArmed !== row) { resArmed = row; drawResList(); return; }
    var cur = null;
    resRows.forEach(function (r) { if (r.row === row) cur = r; });
    setStatus('banner', 'Suppression\u2026');
    google.script.run
      .withSuccessHandler(function () {
        setStatusAndScroll('ok', 'R\u00e9servation supprim\u00e9e.');
        loadRes();
      })
      .withFailureHandler(function (e) {
        resArmed = 0; drawResList();
        setStatusAndScroll('err', esc(e.message));
      })
      .resDelete({ row: row, seenLot: cur ? cur.lot : '' });
  }

  // ---------- MODE D: pré-commandes ----------
  //
  // Demandes the farm cannot serve yet. Same pattern as Réservations:
  // list + form, row-number handles, deletion arms on the first click
  // and acts on the second. Commander prefills the Nouvelle commande
  // form and jumps there; the source row is deleted only after that
  // order SAVES (demAfterOrder), so abandoning costs nothing.
  //
  // All fields mandatory except Commentaires. Poids: dropdown for
  // Alevins, free grams field for Poisson. Server re-checks everything.

  const DEM_POIDS_AL = ['0.5', '1', '1.5', '2', '3', '4', '5', '10'];

  /** '2026-08-19' -> '19/8'. Year appended only when not current. */
  function demFmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return String(s || '');
    var out = Number(m[3]) + '/' + Number(m[2]);
    if (Number(m[1]) !== (new Date()).getFullYear()) out += '/' + m[1].slice(2);
    return out;
  }

  /** Column is narrow; the data keeps the full word. */
  function demTypeShort(t) {
    if (t === 'Alevins') return 'Alv';
    if (t === 'Poisson') return 'Gro';
    return t;
  }

  let demRows = [];    // last list from the server
  let demEdit = 0;     // row being edited; 0 = adding
  let demArmed = 0;    // row armed for deletion; 0 = none

  // Set by demCommander, cleared when the user leaves the order tab.
  let pendingDem = null;

  function renderDem() {
    el('paneDem').innerHTML =
      '<div style="margin-bottom:10px">' +
        '<button onclick="demVerifStock()" ' +
          'style="background:#188038;color:#fff;border-color:#188038">' +
          'Actualiser le stock</button> ' +
        '<span id="demPool" class="muted"></span></div>' +
      '<div id="demList">Chargement…</div>' +
      '<div id="demForm"></div>';
    // The verdict is what the tab is opened FOR, so it is not left
    // behind a click. The button stays, as a refresh: the pools move
    // whenever an order is saved elsewhere in the same session.
    loadDem(demVerifStock);
  }

  function loadDem(then) {
    google.script.run
      .withSuccessHandler(function (rows) {
        demRows = rows; demArmed = 0; demStock = null; demDirty = false;
        if (el('demPool')) el('demPool').textContent = '';
        drawDemList(); drawDemForm();
        if (typeof then === 'function') then();
      })
      .withFailureHandler(function (e) {
        el('demList').innerHTML = '<div class="err">Erreur : ' + esc(e.message) + '</div>';
      })
      .demList();
  }

  let demStock = null;   // row -> verdict from the last stock check
  let demDirty = false;  // arrows moved lines; the server has not seen the order yet
  let demTol = 25;       // band width in %, as reported by the server

  /**
   * Amount-only check, on demand. Pool per type = available fish
   * (Stock Poisson - réservations - commandes non déduites), allocated
   * to the pré-commandes in list order, oldest first. Advisory: the
   * real block stays at order entry, against the lot file.
   */
  function demVerifStock() {
    // The pool line carries the progress message. setStatus is left
    // alone: this now runs after every load, including the one that
    // follows a save, and it must not wipe "Pré-commande ajoutée".
    if (el('demPool')) el('demPool').textContent = 'Vérification du stock…';
    google.script.run
      .withSuccessHandler(function (res) {
        demStock = {};
        res.rows.forEach(function (v) { demStock[v.row] = v; });
        if (res.tol) demTol = Math.round(res.tol * 100);
        el('demPool').textContent = 'Disponible : Alevins ' + fmtNum(res.pool.Alevins) +
          ' — Poisson ' + fmtNum(res.pool.Poisson);
        drawDemList();
      })
      .withFailureHandler(function (e) {
        el('demPool').textContent = '';
        setStatusAndScroll('err', 'Stock non vérifié : ' + esc(e.message));
      })
      .demCheckStock();
  }

  function demDispoCell(r) {
    var base = 'padding:6px 8px;border:1px solid #dadce0';
    var sub = '<div style="font-weight:normal;color:#5f6368;font-size:14px;margin-top:2px">';
    var v = demStock[r.row];
    if (!v || !v.statut) return '<td style="' + base + '">—</td>';
    if (v.statut === 'DISPONIBLE') {
      return '<td style="' + base + ';color:#188038;font-weight:bold">Disponible' +
        sub + esc(v.lots.map(function (l) {
          return l.lot + ' (' + fmtNum(l.nb) + ')';
        }).join(', ')) + '</div></td>';
    }
    if (v.statut === 'PM') {
      // The nearest lots by weight, not the size of the shortfall: the
      // question this cell has to answer is "which lot instead?".
      var near = (v.proche && v.proche.length)
        ? 'le plus proche : ' + esc(v.proche.map(function (l) {
            return l.lot + ' (' + fmtNum(l.nb) + ' à ' + l.pm + ' g)';
          }).join(', '))
        : fmtNum(v.bande) + ' à ' + esc(r.poids) + ' g ±' + demTol + ' %';
      return '<td style="' + base + ';color:#e37400;font-weight:bold">PM pas disponible' +
        sub + near + '</div></td>';
    }
    return '<td style="' + base + ';color:#d93025;font-weight:bold">Indisponible' +
      sub + 'manque ' + fmtNum(v.manque) + '</div></td>';
  }

  function drawDemList() {
    if (!demRows.length) {
      el('demList').innerHTML = '<div class="warn">Aucune pré-commande.</div>';
      return;
    }
    var h = '';
    if (demDirty) {
      h += '<div class="warn" style="margin-bottom:10px">Ordre modifié, pas encore enregistré. ' +
        '<button onclick="demSaveOrder()" ' +
          'style="background:#188038;color:#fff;border-color:#188038">Enregistrer l’ordre</button> ' +
        '<button onclick="demCancelOrder()">Annuler</button></div>';
    }
    h += '<div class="demWrap"><table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px">' +
      '<tr style="text-align:left;border-bottom:2px solid #dadce0">' +
      '<th style="padding:6px 8px;border:1px solid #dadce0">Date</th>' +
      '<th style="padding:6px 8px;border:1px solid #dadce0">Client</th>' +
      '<th style="padding:6px 8px;border:1px solid #dadce0">Contact</th>' +
      '<th style="padding:6px 8px;border:1px solid #dadce0">Type</th>' +
      '<th style="padding:6px 8px;border:1px solid #dadce0">Nombre</th>' +
      '<th style="padding:6px 8px;border:1px solid #dadce0">Prix</th>' +
      '<th style="padding:6px 8px;border:1px solid #dadce0">(g)</th>' +
      '<th style="padding:6px 8px;border:1px solid #dadce0">Commentaires</th>' +
      (demStock ? '<th style="padding:6px 8px;border:1px solid #dadce0">Disponibilité</th>' : '') +
      '<th style="padding:6px 8px;border:1px solid #dadce0"></th></tr>';
    demRows.forEach(function (r, idx) {
      var armed = (demArmed === r.row);
      var first = (idx === 0), last = (idx === demRows.length - 1);
      // Nothing may act on a queue the server has not seen: an edit
      // would reload the list and silently drop the unsaved order.
      var dis = demDirty ? ' disabled' : '';
      // The form is below the table; the tint is what ties the two
      // together when both cannot be on screen at once.
      var demEditRowBg = (demEdit === r.row) ? ';background:#fef7e0' : '';
      h += '<tr style="border-bottom:1px solid #e8eaed' + demEditRowBg + '">' +
        '<td style="padding:6px 8px;border:1px solid #dadce0">' + esc(demFmtDate(r.date)) + '</td>' +
        '<td style="padding:6px 8px;border:1px solid #dadce0">' + esc(r.client) + '</td>' +
        '<td style="padding:6px 8px;border:1px solid #dadce0">' + esc(r.contact) + '</td>' +
        '<td style="padding:6px 8px;border:1px solid #dadce0">' + esc(demTypeShort(r.type)) + '</td>' +
        '<td style="padding:6px 8px;border:1px solid #dadce0">' + (r.nombre == null ? '' : fmtNum(r.nombre)) + '</td>' +
        '<td style="padding:6px 8px;border:1px solid #dadce0">' + (r.prix == null ? '' : fmtNum(r.prix)) + '</td>' +
        '<td style="padding:6px 8px;border:1px solid #dadce0">' + (r.poids == null ? '' : esc(r.poids)) + '</td>' +
        '<td style="padding:6px 8px;border:1px solid #dadce0">' + esc(r.commentaires) + '</td>' +
        (demStock ? demDispoCell(r) : '') +
        '<td style="padding:6px 8px;border:1px solid #dadce0;white-space:nowrap">' +
          '<button class="demBtn" onclick="demMove(' + r.row + ',-1)" title="Monter"' +
            (first ? ' disabled' : '') + '>&#9650;</button> ' +
          '<button class="demBtn" onclick="demMove(' + r.row + ',1)" title="Descendre"' +
            (last ? ' disabled' : '') + '>&#9660;</button> ' +
          '<button class="demBtn" onclick="demCommander(' + r.row + ')"' + dis + '>Commander</button> ' +
          '<button class="demBtn" onclick="demStartEdit(' + r.row + ')"' + dis + '>Modifier</button> ' +
          '<button class="demBtn" onclick="demAskDelete(' + r.row + ')"' + dis +
            (armed ? ' style="background:#d93025;color:#fff"' : '') +
            '>' + (armed ? 'Confirmer' : 'Supprimer') + '</button>' +
        '</td></tr>';
    });
    el('demList').innerHTML = h + '</table></div>';
  }

  let demPrixUser = false;   // the user typed the price; stop recomputing it

  function drawDemForm() {
    var cur = null;
    demRows.forEach(function (r) { if (r.row === demEdit) cur = r; });
    if (demEdit && !cur) demEdit = 0;          // row vanished under us

    var type = cur ? cur.type : 'Alevins';
    el('demForm').innerHTML =
      '<h3 style="margin:0 0 10px">' +
        (demEdit ? 'Modifier la pré-commande' : 'Nouvelle pré-commande') +
      '</h3>' +
      '<div style="margin-bottom:10px"><label>Date<br>' +
        '<input id="dDate" type="date" value="' +
        esc(cur && cur.date ? cur.date : todayISO()) + '"></label></div>' +
      '<div style="margin-bottom:10px"><label>Client<br>' +
        '<input id="dClient" type="text" size="30" value="' + esc(cur ? cur.client : '') + '"></label></div>' +
      '<div style="margin-bottom:10px"><label>Contact<br>' +
        '<input id="dContact" type="text" size="30" value="' + esc(cur ? cur.contact : '') + '"></label></div>' +
      '<div style="margin-bottom:10px"><label>Type<br>' +
        '<select id="dType" onchange="demTypeChanged()">' +
        '<option value="Alevins"' + (type === 'Alevins' ? ' selected' : '') + '>Alevins</option>' +
        '<option value="Poisson"' + (type === 'Poisson' ? ' selected' : '') + '>Poisson</option>' +
        '</select></label></div>' +
      '<div style="margin-bottom:10px"><label>Nombre<br>' +
        '<input id="dNombre" type="number" min="1" step="1" oninput="demRecalcPrix()" value="' +
        (cur && cur.nombre != null ? cur.nombre : '') + '"></label></div>' +
      '<div style="margin-bottom:10px" id="dPoidsWrap"></div>' +
      '<div style="margin-bottom:10px" id="dCatWrap"></div>' +
      '<div style="margin-bottom:10px" id="dLivWrap"></div>' +
      '<div style="margin-bottom:10px"><label>Prix (Ar)<br>' +
        '<input id="dPrix" type="text" inputmode="decimal" oninput="demPrixTyped()" value="' +
        (cur && cur.prix != null ? cur.prix : '') + '"></label>' +
        '<div class="muted" id="dPrixNote"></div></div>' +
      '<div style="margin-bottom:12px"><label>Commentaires (facultatif)<br>' +
        '<input id="dComm" type="text" size="50" value="' + esc(cur ? cur.commentaires : '') + '"></label></div>' +
      '<button onclick="demSave()">' + (demEdit ? 'Enregistrer' : 'Ajouter') + '</button>' +
      (demEdit ? ' <button onclick="demCancelEdit()">Annuler</button>' : '');
    // A stored price is a decision and is kept; a blank one (new form,
    // legacy row) is computed. Emptying the field returns it to the tarif.
    demPrixUser = !!(cur && cur.prix != null);
    demTypeChanged();
  }

  /**
   * Type-dependent fields, mirroring Nouvelle commande exactly:
   * Alevins - poids dropdown, Type de client, Livraison.
   * Poisson - free grams, Qualité, no livraison.
   */
  function demTypeChanged() {
    var cur = null;
    demRows.forEach(function (r) { if (r.row === demEdit) cur = r; });
    var poids = (cur && cur.poids != null) ? String(cur.poids) : '';
    var al = (el('dType').value === 'Alevins');

    var w = el('dPoidsWrap');
    if (al) {
      var opts = '<option value="">— choisir —</option>';
      DEM_POIDS_AL.forEach(function (v) {
        opts += '<option value="' + v + '"' + (poids === v ? ' selected' : '') + '>' + v + '</option>';
      });
      w.innerHTML = '<label>Poids (g)<br><select id="dPoids" onchange="demRecalcPrix()">' + opts + '</select></label>';
    } else {
      w.innerHTML = '<label>Poids (g)<br>' +
        '<input id="dPoids" type="number" min="1" step="any" value="' + esc(poids) + '"></label>';
    }

    var cat = (cur && cur.categorie) ? cur.categorie : (al ? 'avec' : 'detail');
    el('dCatWrap').innerHTML = al
      ? '<label>Type de client<br><select id="dCat" onchange="demRecalcPrix()">' +
          '<option value="avec"' + (cat === 'avec' ? ' selected' : '') + '>Client provende</option>' +
          '<option value="sans"' + (cat === 'sans' ? ' selected' : '') + '>Pas client provende</option>' +
        '</select></label>'
      : '<label>Qualité<br><select id="dCat" onchange="demRecalcPrix()">' +
          '<option value="detail"' + (cat === 'detail' ? ' selected' : '') + '>Détail</option>' +
          '<option value="gros"' + (cat === 'gros' ? ' selected' : '') + '>Gros</option>' +
        '</select></label>';

    var liv = (cur && cur.livraison) ? cur.livraison : 'enlevement';
    el('dLivWrap').innerHTML = al
      ? '<label>Livraison<br><select id="dLiv" onchange="demRecalcPrix()">' +
          '<option value="enlevement"' + (liv === 'enlevement' ? ' selected' : '') + '>Enlèvement à la ferme</option>' +
          '<option value="environs"' + (liv === 'environs' ? ' selected' : '') + '>Livraison environs de la ferme</option>' +
          '<option value="ambohim"' + (liv === 'ambohim' ? ' selected' : '') + '>Livraison Ambohimangakely</option>' +
        '</select></label>'
      : '';
    demRecalcPrix();
  }

  function demPrixTyped() {
    demPrixUser = String(el('dPrix').value).trim() !== '';
    if (!demPrixUser) demRecalcPrix();        // emptied = back to the tarif
    else demPrixNote();
  }

  /**
   * Prix from the SAME grid the order form uses (tarifBandForPm /
   * tarifColumnKey / TARIFS.fish - one grid, two screens, no drift):
   * Alevins - band(poids) x categorie x livraison x tier, the tier
   * judged on nombre + 5 %, which is exactly the colonne H that
   * Commander will produce. Poisson - flat Détail/Gros per kg.
   * A typed price is never overwritten.
   */
  function demRecalcPrix() {
    if (demPrixUser || !TARIFS || !el('dPrix')) { demPrixNote(); return; }
    var price = null;
    if (el('dType').value === 'Alevins') {
      var band = tarifBandForPm(num(el('dPoids') ? el('dPoids').value : ''));
      if (band) {
        var n = num(el('dNombre').value);
        var tier = (n !== null && Math.round(n * 1.05) <= 5000) ? 'le' : 'gt';
        price = band[el('dCat').value][tarifColumnKey(el('dLiv').value, tier)] || null;
      }
    } else {
      price = TARIFS.fish[el('dCat').value] || null;
    }
    el('dPrix').value = (price == null) ? '' : price;
    demPrixNote();
  }

  function demPrixNote() {
    var n = el('dPrixNote');
    if (!n) return;
    n.textContent = demPrixUser
      ? 'Prix saisi à la main — vider le champ pour revenir au tarif.'
      : (el('dType').value === 'Alevins'
          ? 'Tarif automatique (Ar par alevin).' : 'Tarif automatique (Ar par kg).');
  }

  /**
   * Move one line up or down IN THE BROWSER ONLY - no round trip, so
   * bringing the last line to the top is nine instant clicks and one
   * save. The verdicts are dropped at the first move: they were
   * computed on the old queue and would now be wrong.
   */
  function demMove(row, dir) {
    var at = -1;
    demRows.forEach(function (r, i) { if (r.row === row) at = i; });
    var to = at + (dir < 0 ? -1 : 1);
    if (at < 0 || to < 0 || to >= demRows.length) return;
    var tmp = demRows[at]; demRows[at] = demRows[to]; demRows[to] = tmp;
    demDirty = true; demArmed = 0; demStock = null;
    if (el('demPool')) el('demPool').textContent = 'Ordre modifié — enregistrer pour recalculer.';
    drawDemList();
  }

  /** One write for the whole order, then one re-check. */
  function demSaveOrder() {
    setStatus('banner', 'Enregistrement de l’ordre…');
    google.script.run
      .withSuccessHandler(function () {
        setStatus('ok', 'Ordre enregistré.');
        loadDem(demVerifStock);
      })
      .withFailureHandler(function (e) { setStatusAndScroll('err', esc(e.message)); })
      .demSetOrder(demRows.map(function (r) { return r.row; }));
  }

  function demCancelOrder() {
    setStatus('', '');
    loadDem(demVerifStock);
  }

  function demStartEdit(row) {
    demEdit = row; demArmed = 0;
    drawDemList(); drawDemForm();
    var cur = null;
    demRows.forEach(function (r) { if (r.row === row) cur = r; });
    setStatus('banner', 'Modification de la pré-commande de <b>' +
      esc(cur ? cur.client : '') + '</b> — le formulaire est en bas de l’écran.');
    // Without this the form is rebuilt off-screen and the click looks
    // like it did nothing at all.
    var f = el('demForm');
    if (f && f.scrollIntoView) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function demCancelEdit() {
    demEdit = 0; drawDemList(); drawDemForm();
    setStatus('', '');
    var t = el('demList');
    if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function demSave() {
    var p = {
      date: el('dDate').value,
      client: el('dClient').value.trim(),
      contact: el('dContact').value.trim(),
      type: el('dType').value,
      nombre: el('dNombre').value,
      commentaires: el('dComm').value,
      poids: el('dPoids') ? el('dPoids').value : '',
      categorie: el('dCat') ? el('dCat').value : '',
      livraison: el('dLiv') ? el('dLiv').value : '',
      prix: el('dPrix').value
    };
    // All fields mandatory except Commentaires. The server re-checks;
    // this check exists so the refusal is instant and names the fields.
    var missing = [];
    if (!p.date) missing.push('Date');
    if (!p.client) missing.push('Client');
    if (!p.contact) missing.push('Contact');
    if (num(p.nombre) === null || !(num(p.nombre) > 0)) missing.push('Nombre');
    if (num(p.poids) === null || !(num(p.poids) > 0)) missing.push('Poids (g)');
    if (num(p.prix) === null || !(num(p.prix) > 0)) missing.push('Prix');
    if (missing.length) {
      setStatusAndScroll('err',
        'Pré-commande NON enregistrée — remplir : ' + missing.join(', ') + '.');
      return;
    }
    setStatus('banner', 'Enregistrement…');
    if (demEdit) {
      var cur = null;
      demRows.forEach(function (r) { if (r.row === demEdit) cur = r; });
      p.row = demEdit;
      p.seenClient = cur ? cur.client : '';
      p.seenContact = cur ? cur.contact : '';
      google.script.run
        .withSuccessHandler(function () {
          demEdit = 0;
          setStatusAndScroll('ok', 'Pré-commande modifiée.');
          loadDem(demVerifStock);
        })
        .withFailureHandler(function (e) { setStatusAndScroll('err', esc(e.message)); })
        .demUpdate(p);
    } else {
      google.script.run
        .withSuccessHandler(function () {
          setStatusAndScroll('ok', 'Pré-commande ajoutée.');
          loadDem(demVerifStock);
        })
        .withFailureHandler(function (e) { setStatusAndScroll('err', esc(e.message)); })
        .demAdd(p);
    }
  }

  function demAskDelete(row) {
    if (demArmed !== row) { demArmed = row; drawDemList(); return; }
    var cur = null;
    demRows.forEach(function (r) { if (r.row === row) cur = r; });
    setStatus('banner', 'Suppression…');
    google.script.run
      .withSuccessHandler(function () {
        setStatusAndScroll('ok', 'Pré-commande supprimée.');
        loadDem(demVerifStock);
      })
      .withFailureHandler(function (e) {
        demArmed = 0; drawDemList();
        setStatusAndScroll('err', esc(e.message));
      })
      .demDelete({ row: row, seenClient: cur ? cur.client : '', seenContact: cur ? cur.contact : '' });
  }

  /**
   * Hand one pré-commande to the order form.
   *
   * The commercial choices travel with it: Type de client and Livraison
   * (Alevins) or Qualité (Poisson) are set on the order form, and the
   * stored prix goes into every prefilled line. The price field is then
   * USER-owned (present and not auto-flagged), so the form's automatic
   * pricing never overwrites it - the price sticks. A legacy line with
   * no stored prix stays blank and the form's own tarif fills it.
   *
   * With a DISPONIBLE verdict, the lines come from the allocated lots,
   * and onLotChange runs on each: the LOT FILE's real count appears
   * under every line before saving. Otherwise one line, worker picks.
   */
  function demCommander(row) {
    var cur = null;
    demRows.forEach(function (r) { if (r.row === row) cur = r; });
    if (!cur) return;
    if (cur.nombre == null || cur.poids == null) {
      setStatusAndScroll('err',
        'Pré-commande incomplète (nombre ou poids manquant) — la modifier d’abord.');
      return;
    }
    var wantAL = (cur.type === 'Alevins');
    var typeVal = '';
    OPTS.types.forEach(function (t) {
      var k = String(t).trim().toUpperCase();
      if (k.indexOf('GROUP') !== -1) return;
      if (wantAL && k.indexOf('AL') === 0) typeVal = t;
      if (!wantAL && k.indexOf('GR') === 0) typeVal = t;
    });

    var v = demStock ? demStock[row] : null;
    var plan = (v && v.statut === 'DISPONIBLE') ? v.lots : [];

    // Canon key -> the dropdown's own label for that lot.
    var labelOf = {};
    OPTS.lots.forEach(function (l) { labelOf[canonKey(l)] = l; });

    switchMode('new');
    pendingDem = { row: cur.row, client: cur.client, contact: cur.contact };
    el('fType').value = typeVal;
    if (wantAL) {
      if (el('fProvende')) el('fProvende').value = cur.categorie || 'avec';
      if (el('fLivraison')) el('fLivraison').value = cur.livraison || 'enlevement';
    } else {
      if (el('fQualite')) el('fQualite').value = cur.categorie || 'detail';
    }

    var px = (cur.prix != null) ? cur.prix : '';
    if (plan.length) {
      lines = plan.map(function (p) {
        var lot = labelOf[p.lot] || '';
        return wantAL
          ? { lot: lot, alevinsNb: p.nb, alevinsLivrer: Math.round(p.nb * 1.05),
              alevinsPrix: px }
          : { lot: lot, poissonKg: Math.round(p.nb * p.pm / 100) / 10, prixKg: px };
      });
    } else {
      lines = wantAL
        ? [{ alevinsNb: cur.nombre, alevinsPm: cur.poids,
             alevinsLivrer: Math.round(cur.nombre * 1.05), alevinsPrix: px }]
        : [{ prixKg: px }];
    }
    renderLines();
    onLivraisonChange();   // Ambohimangakely shows its km field
    // A value set by script fires no change event: run the lookup by hand.
    document.querySelectorAll('select[data-k="lot"]').forEach(function (sel) {
      if (sel.value) onLotChange(sel);
    });

    el('fClient').value = cur.client;
    el('fContact').value = cur.contact;
    el('fRemarques').value = 'Pré-commande ' + cur.poids + ' g' +
      (cur.commentaires ? ' — ' + cur.commentaires : '');

    var how = plan.length
      ? 'lots pré-remplis : ' + plan.map(function (p) {
          return (labelOf[p.lot] || p.lot) + ' (' + fmtNum(p.nb) + ')';
        }).join(', ') + '. Vérifier le stock réel affiché sous chaque lot, puis Enregistrer la commande.'
      : 'choisir le lot puis Enregistrer la commande.';
    setStatusAndScroll('banner', 'Pré-commande de <b>' + esc(cur.client) +
      '</b> chargée — ' + esc(how));
  }

  /**
   * After a successful order save: delete the source pré-commande, but
   * ONLY if the saved client still matches. A user who abandons the
   * hand-off and types an unrelated order must not delete the demande.
   */
  function demAfterOrder(payload) {
    if (!pendingDem) return;
    var p = pendingDem; pendingDem = null;
    if (String(payload.client).trim() !== p.client) return;
    google.script.run
      .withSuccessHandler(function () {
        el('status').innerHTML += '<div class="ok">Pré-commande de ' +
          esc(p.client) + ' retirée de la liste.</div>';
      })
      .withFailureHandler(function (e) {
        el('status').innerHTML += '<div class="warn">Pré-commande NON retirée (' +
          esc(e.message) + ') — la supprimer à la main dans l’onglet Pré-commandes.</div>';
      })
      .demDelete({ row: p.row, seenClient: p.client, seenContact: p.contact });
  }

  // ---------- MODE E: historique ----------
  //
  // Read-only table of every order of the year, newest first. No
  // editing, no deletion: fulfilment is recorded on Paiement &
  // livraison and nowhere else. Rebuilt on every visit - a history
  // that lags the tab next to it would be worse than none.
  //
  // The client filter is local, over the rows already fetched: the
  // list is a few hundred rows, so a round trip per keystroke would
  // buy nothing.

  let histRows = [];

  const HIST_COLOR = {
    'Ouvert':        '#1a73e8',
    'Livré':         '#e37400',
    'Payé':          '#e37400',
    'Livré et payé': '#188038',
    'Annulé':        '#80868b'
  };

  function renderHist() {
    el('paneHist').innerHTML =
      '<div style="margin-bottom:10px">' +
        '<input type="text" id="hSearch" placeholder="Filtrer : n° commande, client ou statut" ' +
          'style="max-width:420px" oninput="drawHist()">' +
      '</div>' +
      '<div id="histInfo" class="muted" style="margin-bottom:8px">Chargement…</div>' +
      '<div id="histTable"></div>';
    google.script.run
      .withSuccessHandler(function (h) {
        histRows = h.orders;
        el('histInfo').textContent = 'Année ' + h.annee + ' — ' +
          fmtNum(histRows.length) + ' commandes';
        drawHist();
      })
      .withFailureHandler(function (e) {
        el('histTable').innerHTML = '<div class="err">Erreur : ' + esc(e.message) + '</div>';
      })
      .histList();
  }

  /** Quantity ordered: alevins as a count, grossis as a fish count. */
  function histQty(o) {
    const bits = [];
    if (Number(o.alevinsTotal || 0) > 0) {
      bits.push(fmtNum(Number(o.alevinsTotal)) + ' alevins');
    }
    if (Number(o.poissonNbTotal || 0) > 0) {
      bits.push(fmtNum(Math.round(Number(o.poissonNbTotal))) + ' grossis');
    }
    return bits.join(' + ');
  }

  function drawHist() {
    const q = (el('hSearch') ? el('hSearch').value : '').trim().toLowerCase();
    const rows = q
      ? histRows.filter(function (o) {
          return (o.orderNumber + ' ' + o.client + ' ' + o.statut)
                 .toLowerCase().indexOf(q) !== -1;
        })
      : histRows;

    if (!rows.length) {
      el('histTable').innerHTML = '<div class="warn">Aucune commande.</div>';
      return;
    }

    const cell = 'padding:6px 8px;border:1px solid #dadce0';
    var total = 0;
    var h = '<table style="width:100%;border-collapse:collapse;margin-bottom:20px">' +
      '<tr style="text-align:left;border-bottom:2px solid #dadce0">' +
      '<th style="' + cell + '">Date</th>' +
      '<th style="' + cell + '">N° commande</th>' +
      '<th style="' + cell + '">N° facture</th>' +
      '<th style="' + cell + '">Client</th>' +
      '<th style="' + cell + '">Quantité</th>' +
      '<th style="' + cell + '">Montant</th>' +
      '<th style="' + cell + '">Statut</th></tr>';

    rows.forEach(function (o) {
      total += Number(o.montantAr || 0);
      const col = HIST_COLOR[o.statut] || '#3c4043';
      h += '<tr>' +
        '<td style="' + cell + ';white-space:nowrap">' + esc(o.dateCommande) + '</td>' +
        '<td style="' + cell + '"><b>' + esc(o.orderNumber || '(sans numéro)') + '</b></td>' +
        '<td style="' + cell + ';white-space:nowrap">' +
          esc(String(o.facture || '').trim() || '—') + '</td>' +
        '<td style="' + cell + '">' + esc(o.client) + '</td>' +
        '<td style="' + cell + '">' + esc(histQty(o)) + '</td>' +
        '<td style="' + cell + ';white-space:nowrap">' + fmtAr(o.montantAr) + '</td>' +
        '<td style="' + cell + ';color:' + col + ';font-weight:bold">' + esc(o.statut) + '</td>' +
        '</tr>';
    });

    // Total of what is LISTED, so a filtered view totals the filter.
    h += '<tr style="border-top:2px solid #dadce0">' +
      '<td style="' + cell + '" colspan="5"><b>Total (' + fmtNum(rows.length) + ')</b></td>' +
      '<td style="' + cell + ';white-space:nowrap"><b>' + fmtAr(total) + '</b></td>' +
      '<td style="' + cell + '"></td></tr>';

    el('histTable').innerHTML = h + '</table>';
  }

  // ---------- MODE A: new order ----------
  function renderNew() {
    // Display friendly labels but keep the RAW value: column B is
    // matched by automatismescommande against O.PREFIXES ("AL"/"GR"),
    // and anything else is cleared by ac_enforceOrderRange_. So the
    // label is cosmetic only — the option value must stay untouched.
    const typeOpts = OPTS.types
      .filter(t => String(t).toLowerCase().indexOf('group') === -1)   // groupée is automatic
      .map(t => '<option value="'+esc(t)+'">'+esc(typeLabel(t))+'</option>').join('');

    el('paneNew').innerHTML =
      '<div class="card"><h3>Commande</h3>' +
        '<div class="row">' +
          '<div><label>Type</label><select id="fType" onchange="renderLines()">' +
            '<option value="">-- choisir --</option>' + typeOpts + '</select></div>' +
          '<div><label>Date commande</label><input type="date" id="fDate" value="'+todayISO()+'"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div><label>Client</label><input type="text" id="fClient"></div>' +
          '<div><label>Contact</label><input type="text" id="fContact"></div>' +
        '</div>' +
        // No N° facture here, deliberately. AutoCommandes mints it when a
        // Date livraison is entered, and it SKIPS any order that already
        // has a value in column C. A number typed at this stage would not
        // just be premature - it would permanently stop the generator for
        // that order, and break the routine grouping of several orders
        // onto one invoice. It stays editable on Paiement & livraison.
        '<label>Bon de livraison externe</label><input type="text" id="fBl">' +
        '<label>Remarques / destination</label><input type="text" id="fRemarques">' +
        '<div class="row">' +
          '<div id="provendeWrap"><label>Type de client</label>' +
            '<select id="fProvende" onchange="recomputeAllPrices()">' +
              '<option value="avec">Client provende</option>' +
              '<option value="sans">Pas client provende</option>' +
            '</select></div>' +
          '<div id="qualiteWrap" style="display:none"><label>Qualit\u00e9</label>' +
            '<select id="fQualite" onchange="recomputeAllPrices()">' +
              '<option value="detail">D\u00e9tail</option>' +
              '<option value="gros">Gros</option>' +
            '</select></div>' +
        '</div>' +
        '<div class="row" id="livRow">' +
          '<div><label>Livraison</label>' +
            '<select id="fLivraison" onchange="onLivraisonChange()">' +
              '<option value="enlevement">Enl\u00e8vement \u00e0 la ferme</option>' +
              '<option value="environs">Livraison environs de la ferme</option>' +
              '<option value="ambohim">Livraison Ambohimangakely</option>' +
            '</select></div>' +
          '<div id="kmWrap" style="display:none"><label>Km depuis Ambohimangakely</label>' +
            '<input type="text" inputmode="decimal" id="fKm" oninput="recomputeTransport()"></div>' +
        '</div>' +
      '</div>' +
      '<div id="gateMsg"></div>' +
      '<div id="linesWrap"></div>' +
      '<button class="primary" style="margin-top:12px" onclick="addLine()">+ Ajouter un lot</button>' +
      '<button class="ghost" style="margin-top:12px;margin-left:8px" id="btnRefreshLots" ' +
        'onclick="doRefreshLots()">Actualiser les lots vendables</button>' +
      '<div id="refreshLotsMsg" class="muted" style="margin-top:6px"></div>' +
      '<div class="card"><h3>Prix total</h3><div id="totalAmount" class="totalAmount">—</div></div>' +
      '<button class="go" id="btnCreate" onclick="doCreate()">Enregistrer la commande</button>';
    renderLines();
  }

  /** Cosmetic label for a raw order-type code. Unknown codes pass through. */
  function typeLabel(t) {
    const k = String(t).trim().toUpperCase();
    if (k === 'AL') return 'Alevins';
    if (k === 'GR') return 'Grossis';
    return t;
  }

  function isAlevins() {
    const t = (el('fType') && el('fType').value) || '';
    return t.toUpperCase().indexOf('AL') === 0;
  }

  function renderLines() {
    const wrap = el('linesWrap');
    if (!wrap) return;
    const t = (el('fType') && el('fType').value) || '';
    if (!t) { wrap.innerHTML = ''; return; }

    // Lots incompatible with the chosen type are shown but DISABLED -
    // visible and greyed, never hidden. A lot missing from Stock Poisson
    // has no PM, so it stays selectable and falls through to the normal
    // per-lot check: a gap in one sheet must not make a real lot vanish.
    const alSel = isAlevins();
    const lotOpts = OPTS.lots.map(l => {
      const key = canonKey(l);
      // A TOUT reservation blocks regardless of PM or type, so it is
      // tested first and its label wins - "incompatible" would send
      // someone looking at the wrong problem.
      const isReserved = !!(GATE && GATE.reservedAll && GATE.reservedAll[key]);
      const pm = (GATE && GATE.pm) ? GATE.pm[key] : undefined;
      if (isReserved) {
        return '<option value="'+esc(l)+'" disabled>' + esc(l) +
               (pm === undefined ? '' : ' \u00b7 ' + fmtNum(pm) + ' g') +
               ' \u2014 r\u00e9serv\u00e9</option>';
      }
      // Learned during this page's life, not known at load: the lot file
      // is only opened when a lot is picked. Once one selection has proved
      // a sub-lot carries no stock, it stays greyed for every line.
      if (NOT_SELLABLE[key]) {
        return '<option value="'+esc(l)+'" disabled>' + esc(l) +
               (pm === undefined ? '' : ' \u00b7 ' + fmtNum(pm) + ' g') +
               ' \u2014 pas encore vendable</option>';
      }
      if (pm === undefined) return '<option value="'+esc(l)+'">'+esc(l)+'</option>';
      const v = lotTypeVerdict(alSel, pm);
      // Available count from the load-time gate data: the number the
      // save check will accept, not the raw Stock Poisson count. Hidden
      // on blocked lots - a count next to "incompatible" invites a
      // fight with a greyed option.
      const av = (GATE && GATE.avail) ? GATE.avail[key] : undefined;
      const tag = ' \u00b7 ' + fmtNum(pm) + ' g' +
        (av === undefined || v.level === 'block' ? '' : ' \u00b7 ' + fmtNum(av) + ' poissons') +
        (v.level === 'block' ? ' \u2014 incompatible' : (v.level === 'warn' ? ' \u2014 \u00e0 confirmer' : ''));
      return '<option value="'+esc(l)+'"' + (v.level === 'block' ? ' disabled' : '') + '>' +
             esc(l) + tag + '</option>';
    }).join('');
    const al = isAlevins();
    if (el('provendeWrap')) el('provendeWrap').style.display = al ? '' : 'none';
    if (el('qualiteWrap'))  el('qualiteWrap').style.display  = al ? 'none' : '';
    // GR has no livraison logic at all: flat Detail/Gros price, frais
    // additionnels typed by hand (Kim 2026-08-12). Hide the whole row.
    if (el('livRow')) el('livRow').style.display = al ? '' : 'none';

    wrap.innerHTML = lines.map((ln, i) =>
      '<div class="card"><div class="lineHead"><h3>Lot ' + (i+1) + '</h3>' +
        (lines.length > 1 ? '<span class="del" onclick="removeLine('+i+')">Retirer</span>' : '') +
      '</div>' +
      '<label>Lot</label><select data-l="'+i+'" data-k="lot" onchange="onLotChange(this)">' +
        '<option value="">-- choisir --</option>' + lotOpts + '</select>' +
      '<div class="muted" id="avail'+i+'"></div>' +
      (al
        ? '<div class="row">' +
            '<div><label>Nombre alevins commandés</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="alevinsNb" oninput="syncLivrer('+i+')"></div>' +
            '<div><label>PM alevins (g)</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="alevinsPm" oninput="recomputeLinePrice('+i+')"></div>' +
          '</div>' +
          '<div class="row">' +
            '<div><label>Alevins à livrer (+5%)</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="alevinsLivrer" id="livrer'+i+'" oninput="recomputeLinePrice('+i+')">' +
              '<div class="muted">Pré-calculé à +5%, modifiable.</div></div>' +
            '<div><label>Prix alevin</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="alevinsPrix"></div>' +
          '</div>' +
          '<label>Prix transport</label>' +
          '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="transport">'
        : '<div class="row">' +
            '<div><label>Kg poisson commandé</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="poissonKg"></div>' +
            '<div><label>PM poisson (g)</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="poissonPm"></div>' +
          '</div>' +
          '<div class="row">' +
            '<div><label>Prix / kg</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="prixKg"></div>' +
            '<div><label>Frais additionnels</label>' +
              '<input type="text" inputmode="decimal" data-l="'+i+'" data-k="frais"></div>' +
          '</div>') +
      '</div>'
    ).join('');
    restoreLines();
    recomputeAllPrices();
  }

  /** Keep typed values across re-renders. */
  function stashLines() {
    document.querySelectorAll('[data-l]').forEach(inp => {
      const i = Number(inp.getAttribute('data-l'));
      const k = inp.getAttribute('data-k');
      lines[i] = lines[i] || {};
      lines[i][k] = inp.value;
    });
  }
  function restoreLines() {
    document.querySelectorAll('[data-l]').forEach(inp => {
      const i = Number(inp.getAttribute('data-l'));
      const k = inp.getAttribute('data-k');
      if (lines[i] && lines[i][k] !== undefined) inp.value = lines[i][k];
    });
  }

  function addLine() { stashLines(); lines.push({}); renderLines(); }
  function removeLine(i) { stashLines(); lines.splice(i, 1); renderLines(); }

  /** "+5%" default, still overridable. */
  function syncLivrer(i) {
    const nbInp = document.querySelector('[data-l="'+i+'"][data-k="alevinsNb"]');
    const lvInp = el('livrer'+i);
    if (!nbInp || !lvInp) return;
    const n = num(nbInp.value);
    if (n === null) return;
    if (!lvInp.dataset.touched) lvInp.value = Math.round(n * 1.05);
    // H decides the <=5000 / >5000 price tier, so a qty change can
    // change the price - and this programmatic write fires no input
    // event, so recompute explicitly.
    recomputeLinePrice(i);
  }
  document.addEventListener('input', e => {
    if (e.target && e.target.id && e.target.id.indexOf('livrer') === 0) e.target.dataset.touched = '1';
  });

  // ---------- Item 3 : stock check ----------

  /**
   * The number of fish the engine will actually subtract for this line.
   * AL -> column H (alevins a livrer). GR -> column N, a sheet formula
   * =IFERROR((L*1000)/M;0), so PM is not advisory: it is the divisor
   * that decides how many fish leave the cage. Blank or zero PM makes N
   * zero, cmdDeduction returns null, and the engine skips the row with
   * no message at all. Returns null when it does not resolve.
   */
  function lineQty(ln, al) {
    if (al) return num(ln.alevinsLivrer);
    const kg = num(ln.poissonKg);
    const pm = num(ln.poissonPm);
    if (kg === null || pm === null || pm <= 0) return null;
    return kg * 1000 / pm;
  }

  function linePm(ln, al) { return al ? num(ln.alevinsPm) : num(ln.poissonPm); }

  /** 16788 -> "16 788" ; 0.73 -> "0,73". */
  function fmtNum(n) {
    if (n === null || n === undefined || !isFinite(n)) return '\u2014';
    const parts = String(Math.round(n * 100) / 100).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.join(',');
  }

  /**
   * Selection-time lookup. Information only - no verdict, no blocking,
   * so staff can quote a customer before writing the order. The save
   * path re-checks against fresh numbers and is the only thing that
   * blocks.
   */
  function onLotChange(sel) {
    const i = Number(sel.getAttribute('data-l'));
    const box = el('avail' + i);
    if (!box) return;
    const key = sel.value;
    if (!key) { box.className = 'muted'; box.innerHTML = ''; return; }
    box.className = 'muted';
    box.innerHTML = 'recherche du stock\u2026';
    google.script.run
      .withSuccessHandler(a => {
        if (sel.value !== key) return;          // user changed lot meanwhile
        if (a.reservedAll) {
          box.className = 'availBlock';
          box.innerHTML = '\u26d4 LOT R\u00c9SERV\u00c9 (TOUT) \u2014 choisir un autre lot.' +
                          '<div style="font-weight:normal;font-size: 15px;margin-top:4px">' +
                          'Ni le PM ni le prix ne seront pr\u00e9-remplis, et la commande ' +
                          'sera refus\u00e9e \u00e0 l\'enregistrement.</div>';
          return;
        }
        if (!a.found) {
          box.className = 'availWarn';
          box.innerHTML = '\u26a0 Lot introuvable dans le fichier lot \u2014 ' +
                          'la d\u00e9duction \u00e9chouera cette nuit.';
          return;
        }
        // The sub-lot exists but its stock cell is empty: fry that have
        // not yet been through the tri are not on sale. Stock Poisson
        // still shows the fish, so this cannot be caught before the lot
        // file is opened - hence the block lands here, not in the list.
        // The server refuses it again at save (qty > available = 0).
        if (!a.count) {
          // Canonical key, not the raw label: renderLines looks NOT_SELLABLE
          // up under canonKey(), and "15 ter-C5" canonicalises to
          // "15TER-C5". Storing the raw label would grey nothing.
          NOT_SELLABLE[canonKey(key)] = true;
          disableLotOption(canonKey(key));
          sel.value = '';                       // fires no event: box stays
          const alNs = isAlevins();
          setAuto(i, alNs ? 'alevinsPm' : 'poissonPm', null);
          if (alNs) setAuto(i, 'alevinsPrix', null);
          box.className = 'availBlock';
          box.innerHTML = '\u26d4 Ce lot ne peut pas encore \u00eatre vendu.' +
                          '<div style="font-weight:normal;font-size: 15px;margin-top:4px">' +
                          'Le fichier lot n\'indique aucun stock pour ce sous-lot. ' +
                          'Choisir un autre lot.</div>';
          return;
        }
        // ---- lot/type gate (Kim 2026-08-12) ----
        // A fry order against a lot of harvest-size fish (or a fish
        // order against a fry lot) is always a mistake. Red-block here,
        // clear any auto-filled PM/price from a previous selection, and
        // the server blocks it again at save (cmdValidateOrderLines).
        const alSel2 = isAlevins();
        const verdict = lotTypeVerdict(alSel2, a.pm);
        if (verdict.level === 'block') {
          box.className = 'availBlock';
          box.innerHTML = '\u26d4 ' + verdict.msg + ' La commande sera refus\u00e9e.';
          setAuto(i, alSel2 ? 'alevinsPm' : 'poissonPm', null);
          if (alSel2) setAuto(i, 'alevinsPrix', null);
          return;
        }
        // A disponible of 0 or less refuses every quantity, so it is shown
        // as a block, not as an informational readout. Otherwise: green
        // bold, or amber when the lot/type gate warned.
        const rien = (a.available == null || a.available <= 0);
        box.className = rien ? 'availBlock'
                            : (verdict.level === 'warn' ? 'availWarn' : 'availOk');
        // Grossis only: fish are sold by weight, so show the kg the lot
        // represents. Rounded down - never overstate what is available.
        var avKg = (!alSel2 && a.available != null && a.pm != null)
          ? Math.floor(a.available * a.pm / 1000) : null;
        box.innerHTML = (verdict.level === 'warn' ? '\u26a0 ' + verdict.msg + '<br>' : '') +
                        'disponible : <b>' + fmtNum(a.available) +
                        '</b> \u00b7 PM : <b>' + fmtNum(a.pm) + ' g</b>' +
                        (avKg != null ? ' \u00b7 <b>' + fmtNum(avKg) + ' kg</b>' : '');
        prefillPm(i, a.pm);
        recomputeLinePrice(i);
      })
      .withFailureHandler(e => {
        box.className = 'availWarn';
        box.innerHTML = 'Stock indisponible : ' + esc(e.message);
      })
      .cmdGetLotAvailability(key);
  }

  /**
   * Rebuild the not-sellable list on demand, for staff, after a tri.
   * Calls the SAME function the nightly trigger calls - no second code
   * path, so a lot can never be judged by two different rules.
   *
   * The set is REPLACED, not merged: a lot that has just been tri'd must
   * lose its grey. Merging would leave it blocked until the next reload.
   *
   * ~90 s, because every lot file is opened. The button is disabled
   * throughout, so it cannot be started twice.
   */
  function doRefreshLots() {
    const btn = el('btnRefreshLots');
    const msg = el('refreshLotsMsg');
    if (btn) { btn.disabled = true; btn.textContent = 'Actualisation…'; }
    if (msg) {
      msg.className = 'banner';
      msg.textContent = 'Lecture de tous les fichiers lot. Environ 90 secondes. Ne pas fermer la page.';
    }
    google.script.run
      .withSuccessHandler(map => {
        const fresh = map || {};
        Object.keys(NOT_SELLABLE).forEach(k => { delete NOT_SELLABLE[k]; });
        Object.keys(fresh).forEach(k => { NOT_SELLABLE[k] = true; });
        if (GATE) GATE.notSellable = fresh;
        stashLines();
        renderLines();
        const b = el('btnRefreshLots');
        const m = el('refreshLotsMsg');
        if (b) { b.disabled = false; b.textContent = 'Actualiser les lots vendables'; }
        if (m) {
          m.className = 'ok';
          m.textContent = 'Liste à jour — ' + Object.keys(fresh).length +
                          ' lot(s) pas encore vendable(s).';
        }
      })
      .withFailureHandler(e => {
        const b = el('btnRefreshLots');
        const m = el('refreshLotsMsg');
        if (b) { b.disabled = false; b.textContent = 'Actualiser les lots vendables'; }
        if (m) { m.className = 'err'; m.textContent = 'Échec : ' + esc(e.message); }
      })
      .refreshNotSellableMap();
  }

  /**
   * Grey out one lot in every line's dropdown, without re-rendering the
   * form (a re-render here would wipe the message that explains why).
   * Any existing " — ..." tag is replaced, so the label never doubles up.
   */
  function disableLotOption(key) {
    document.querySelectorAll('select[data-k="lot"]').forEach(s => {
      for (var o = 0; o < s.options.length; o++) {
        const opt = s.options[o];
        if (!opt.value || canonKey(opt.value) !== key) continue;
        opt.disabled = true;
        opt.textContent = opt.textContent.split(' — ')[0] + ' — pas encore vendable';
      }
    });
  }

  /**
   * OWNERSHIP MODEL for pre-filled fields (2026-08-12, replaces
   * "fill only when blank").
   *
   * "Fill only when blank" froze the form: the first keystroke of a km
   * value wrote 3km worth of transport, the field was no longer blank,
   * and every later change (provende, livraison, Gros, the rest of the
   * km) was refused. One cause, five observed bugs.
   *
   * Rule now: every managed field is either
   *   AUTO  - the app wrote it; the app may rewrite or clear it when
   *           inputs change,
   *   USER  - a human typed in it; the app never touches it again.
   * Typing in a field makes it USER. Clearing it hands it back to AUTO
   * on the next recompute. Flags live in lines[i].__auto so they follow
   * their line through add/remove splices.
   *
   * "What is saved is what is on screen" still holds: the app only ever
   * writes into the visible fields, never behind them.
   */
  const MANAGED_KEYS = { alevinsPm:1, alevinsPrix:1, transport:1, poissonPm:1, prixKg:1 };

  document.addEventListener('input', e => {
    const t = e.target;
    if (!t || !t.getAttribute) return;
    const k = t.getAttribute('data-k');
    const l = t.getAttribute('data-l');
    if (k && l !== null && MANAGED_KEYS[k]) {
      const i = Number(l);
      if (lines[i] && lines[i].__auto) delete lines[i].__auto[k];
      // Emptying a managed field hands it straight back to AUTO. Without
      // this the field stayed blank until some other input fired a
      // recompute, and a blank price saves as no price at all.
      if (String(t.value).trim() === '') recomputeLinePrice(i);
    }
    // Prix total tracks every line field, not just the auto-managed ones
    // (Kg poisson, Frais additionnels, Nombre alevins have no other hook).
    if (l !== null) recomputeGrandTotal();
  });

  /**
   * Write `value` into line i's field IF the field is auto-owned or
   * blank. value === null means "no longer applicable": clear the field
   * only if the app owns it.
   */
  function setAuto(i, key, value) {
    const inp = document.querySelector('[data-l="'+i+'"][data-k="'+key+'"]');
    if (!inp) return;
    lines[i] = lines[i] || {};
    lines[i].__auto = lines[i].__auto || {};
    const isAuto = !!lines[i].__auto[key];
    const isBlank = String(inp.value).trim() === '';
    if (!isAuto && !isBlank) return;                 // USER-owned: never touch
    if (value === null || value === undefined || !isFinite(value) || value === 0) {
      if (isAuto) { inp.value = ''; delete lines[i].__auto[key]; lines[i][key] = ''; recomputeGrandTotal(); }
      return;
    }
    inp.value = String(Math.round(value * 100) / 100).replace('.', ',');
    lines[i].__auto[key] = true;
    lines[i][key] = inp.value;
    recomputeGrandTotal();
  }

  /** Lot PM -> this line's PM field, through the same ownership rules. */
  function prefillPm(i, pm) {
    if (pm === null || pm === undefined || !isFinite(pm) || pm <= 0) return;
    setAuto(i, isAlevins() ? 'alevinsPm' : 'poissonPm', pm);
  }

  // ---------- Tarifs : dynamic price + transport (2026-08-12 v2) ----------

  /**
   * Client mirror of cmdLotTypeVerdict. Boundaries come from GATE, which
   * comes from the server - never hardcoded here, so the two copies
   * cannot drift apart. Returns 'ok' when GATE has not loaded.
   */
  function lotTypeVerdict(isAl, pm) {
    if (!GATE || pm === null || pm === undefined || !isFinite(pm)) return { level: 'ok', msg: '' };
    if (isAl) {
      if (pm > GATE.fryMax) return { level: 'block',
        msg: 'PM du lot ' + fmtNum(pm) + ' g > ' + fmtNum(GATE.fryMax) +
             ' g \u2014 ce n\u2019est pas un lot alevins.' };
      return { level: 'ok', msg: '' };
    }
    if (pm < GATE.grBlock) return { level: 'block',
      msg: 'PM du lot ' + fmtNum(pm) + ' g < ' + fmtNum(GATE.grBlock) +
           ' g \u2014 trop petit pour \u00eatre vendu en grossis.' };
    if (pm < GATE.grWarn) return { level: 'warn',
      msg: 'PM du lot ' + fmtNum(pm) + ' g \u2014 en dessous de ' + fmtNum(GATE.grWarn) +
           ' g ; vente possible mais \u00e0 confirmer.' };
    return { level: 'ok', msg: '' };
  }

  /** Canon key, mirroring cmdCanonKey: trim, upper, collapse spaces. */
  function canonKey(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/\u00A0/g, ' ').trim().toUpperCase().replace(/\s+/g, '');
  }

  /** First band whose max covers this PM. Null above the grid. */
  function tarifBandForPm(pm) {
    if (!TARIFS || pm === null || !isFinite(pm) || pm <= 0) return null;
    for (let i = 0; i < TARIFS.bands.length; i++) {
      if (pm <= TARIFS.bands[i].max) return TARIFS.bands[i];
    }
    return null;
  }

  /** Delivery + quantity tier -> which column of a band to use. */
  function tarifColumnKey(livraison, tier) {
    if (livraison === 'enlevement') return 'enlevement';
    if (livraison === 'environs') return tier === 'le' ? 'environsLe' : 'environsGt';
    if (livraison === 'ambohim')  return tier === 'le' ? 'ambohimLe'  : 'ambohimGt';
    return null;
  }

  /** km x rate/km x 2 (aller-retour). <=50 km : 860 ; >50 km : 950. */
  function transportAmount(km) {
    if (km === null || !isFinite(km) || km <= 0) return null;
    return km * (km <= 50 ? 860 : 950) * 2;
  }

  /**
   * One line's price, recomputed from CURRENT inputs, written through
   * setAuto - so it tracks every change and clears when off the grid.
   *
   * AL : band(PM) x provende x livraison x tier(H<=5000).
   *      H unknown -> 'gt' tier: the cheaper <=5000 price is only
   *      granted once the quantity is known to qualify.
   * GR : flat Detail/Gros. No livraison, no bands.
   */
  function recomputeLinePrice(i) {
    if (!TARIFS) return;
    if (isAlevins()) {
      const pmInp = document.querySelector('[data-l="'+i+'"][data-k="alevinsPm"]');
      const hInp = el('livrer'+i);
      if (!pmInp || !hInp) return;
      const band = tarifBandForPm(num(pmInp.value));
      let price = null;
      if (band) {
        const provende = (el('fProvende') || {}).value || 'avec';
        const livraison = (el('fLivraison') || {}).value || 'enlevement';
        const h = num(hInp.value);
        const tier = (h !== null && h <= 5000) ? 'le' : 'gt';
        price = band[provende][tarifColumnKey(livraison, tier)] || null;
      }
      setAuto(i, 'alevinsPrix', price);
    } else {
      const qualite = (el('fQualite') || {}).value || 'detail';
      setAuto(i, 'prixKg', TARIFS.fish[qualite] || null);
    }
  }

  /** All lines + transport. Called after render and on any order-level change. */
  function recomputeAllPrices() {
    if (!TARIFS) return;
    lines.forEach((ln, i) => recomputeLinePrice(i));
    recomputeTransport();
    recomputeGrandTotal();
  }

  /**
   * Transport: AL orders only, Ambohimangakely only, line 1 only (one
   * delivery per order). Any other state CLEARS an auto-filled amount -
   * switching back to Enlevement must not leave a stale charge behind.
   * GR : frais additionnels is typed by hand, never auto.
   */
  function recomputeTransport() {
    if (!isAlevins()) return;
    const liv = (el('fLivraison') || {}).value;
    const amt = (liv === 'ambohim')
      ? transportAmount(num((el('fKm') || {}).value))
      : null;
    setAuto(0, 'transport', amt);
  }

  /**
   * Client's total, recomputed from CURRENT DOM values (not the lines[]
   * cache, which only refreshes on render/add/remove — a field the user
   * is mid-typing would otherwise read stale). Display only, never sent
   * to the server.
   *
   * AL : Nombre alevins commandés x Prix alevin + Prix transport, per line.
   * GR : Kg poisson commandé x Prix / kg + Frais additionnels, per line.
   * A line missing its quantity or unit price contributes nothing yet.
   */
  function recomputeGrandTotal() {
    const al = isAlevins();
    const byLine = {};
    document.querySelectorAll('[data-l]').forEach(inp => {
      const i = inp.getAttribute('data-l');
      const k = inp.getAttribute('data-k');
      byLine[i] = byLine[i] || {};
      byLine[i][k] = inp.value;
    });
    let total = null;
    Object.keys(byLine).forEach(i => {
      const ln = byLine[i];
      const qty = num(al ? ln.alevinsNb : ln.poissonKg);
      const prix = num(al ? ln.alevinsPrix : ln.prixKg);
      if (qty === null || prix === null) return;
      const extra = num(al ? ln.transport : ln.frais) || 0;
      total = (total || 0) + qty * prix + extra;
    });
    const out = el('totalAmount');
    if (out) out.textContent = total === null ? '—' : fmtNum(total) + ' Ar';
  }

  function onLivraisonChange() {
    const liv = (el('fLivraison') || {}).value;
    const kmWrap = el('kmWrap');
    if (kmWrap) kmWrap.style.display = (liv === 'ambohim') ? '' : 'none';
    recomputeAllPrices();
  }

  function doCreate() {
    stashLines();
    const btn = el('btnCreate');
    btn.disabled = true;
    setStatus('banner', 'Enregistrement…');

    const al = isAlevins();
    const payload = {
      type: el('fType').value,
      dateCommande: el('fDate').value,
      client: el('fClient').value,
      contact: el('fContact').value,
      // facture is not sent: column C belongs to the AutoCommandes generator.
      bl: el('fBl').value,
      remarques: el('fRemarques').value,
      lines: lines.map(ln => {
        const o = { lot: ln.lot || '' };
        if (al) {
          o.alevinsNb = num(ln.alevinsNb);
          o.alevinsPm = num(ln.alevinsPm);
          o.alevinsLivrer = num(ln.alevinsLivrer);
          o.alevinsPrix = num(ln.alevinsPrix);
          o.transport = num(ln.transport);
        } else {
          o.poissonKg = num(ln.poissonKg);
          o.poissonPm = num(ln.poissonPm);
          o.prixKg = num(ln.prixKg);
          o.frais = num(ln.frais);
        }
        return o;
      })
    };

    // ---- Item 3 : check stock before writing anything ----
    // A quantity that does not resolve to a positive number still gets
    // written to the sheet, but cmdDeduction returns null and the engine
    // skips the row in silence - no error, no message in column Z. The
    // server cannot see this (cmdToNum turns Infinity into null, so the
    // line simply counts as zero), so the warning is raised here.
    const localWarn = [];
    const vLines = lines.map((ln, i) => {
      const q = lineQty(ln, al);
      if (q === null || !(q > 0)) {
        localWarn.push('Lot ' + (i + 1) + ' (' + esc(ln.lot || '?') + ') : quantité non calculable' +
