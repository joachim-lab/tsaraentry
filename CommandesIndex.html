          (al ? '' : ' — PM manquant ou nul') +
          ' — le stock ne sera PAS déduit cette nuit.');
      }
      return { lot: ln.lot || '', qty: q, pm: linePm(ln, al) };
    });

    // 2026-08-30: no separate cmdValidateOrderLines round trip any more.
    // cmdCreateOrder runs the same validation server-side and refuses a
    // bad order with the same messages; doubling it here doubled the
    // save time. vLines above is kept only to build localWarn.
    // Server warnings come back in res.warnings — see saveOrder.
    saveOrder(payload, localWarn, btn);
  }

  /** Write the order, then show any warnings next to the confirmation. */
  function saveOrder(payload, warns, btn) {
    setStatus('banner', 'Enregistrement…');
    google.script.run
      .withSuccessHandler(res => {
        lines = [{}];
        renderNew();
        // The counts were read at boot. Without this the fish just
        // sold stay on offer for the next order on the same page.
        loadGateData();
        demAfterOrder(payload);
        const msg = 'Commande <b>' + esc(res.orderNumber) + '</b> enregistrée — ' +
          res.rowCount + ' ligne(s).';
        // Server warnings (PM mismatch, lot/type) now arrive with the
        // save result instead of from a separate pre-check (2026-08-30).
        const allWarns = (res.warnings || []).map(esc).concat(warns);
        el('status').innerHTML =
          '<div class="ok">' + msg + '</div>' +
          (allWarns.length
            ? '<div class="warn">Attention :<ul><li>' +
              allWarns.join('</li><li>') + '</li></ul></div>'
            : '');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .withFailureHandler(e => { btn.disabled = false; setStatusAndScroll('err', esc(e.message)); })
      .cmdCreateOrder(payload);
  }

  // ---------- MODE B: fulfilment ----------
  function renderFul() {
    el('paneFul').innerHTML =
      '<div class="card"><h3>Trouver une commande</h3>' +
        '<div class="row">' +
          '<div><label>Recherche (n° commande, client ou lot)</label>' +
            '<input type="text" id="ficherche" placeholder="ex: AL-26-155 ou Adelaiade"></div>' +
          '<div style="flex:0 0 220px"><label>&nbsp;</label>' +
            '<button class="primary" style="width:100%" onclick="doSearch()">Rechercher</button></div>' +
        '</div>' +
        '<label style="font-weight:normal"><input type="checkbox" id="fDeliveredUnpaid" checked style="width:auto"> ' +
          'Commandes livrées et non-payées</label>' +
        '<label style="font-weight:normal"><input type="checkbox" id="fUndelivered" checked style="width:auto"> ' +
          'Commandes non-livrées</label>' +
      '</div>' +
      '<div id="fulForm"></div>' +
      '<div id="hits"></div>';
    el('ficherche').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
    el('fDeliveredUnpaid').addEventListener('change', () => doSearch());
    el('fUndelivered').addEventListener('change', () => doSearch());

    // One delegated listener on the container: survives every re-render
    // of the results list, so nothing has to be re-attached.
    el('hits').addEventListener('click', function (ev) {
      const card = ev.target.closest ? ev.target.closest('.hit') : null;
      if (!card) return;
      const key = card.getAttribute('data-key');
      if (key) selectHit(key);
    });

    doSearch();
  }

  /**
   * keepMsg: {cls, html} to restore once the refreshed list has
   * rendered. Without it, a save confirmation set just before calling
   * doSearch() is wiped by this function's own status updates before
   * the user can read it.
   */
  /** Montant in Ar, thousands-spaced. '—' when there is nothing. */
  function fmtAr(v) {
    const n = Number(v || 0);
    if (!isFinite(n) || n === 0) return '—';
    return fmtNum(n) + ' Ar';
  }

  /** Quantity of one order: alevins as a count, poisson in kg. Both are
   *  shown when an order carries both, which a multi-lot order can. */
  function hitQty(o) {
    const bits = [];
    if (Number(o.alevinsTotal || 0) > 0) {
      bits.push(fmtNum(Number(o.alevinsTotal)) + ' alevins');
    }
    if (Number(o.poissonKgTotal || 0) > 0) {
      bits.push(fmtNum(Number(o.poissonKgTotal)) + ' kg');
    }
    return bits.length ? ' · ' + esc(bits.join(' + ')) : '';
  }

  function doSearch(keepMsg) {
    setStatus('banner', 'Recherche…');
    el('fulForm').innerHTML = '';
    selectedKey = null;
    google.script.run
      .withSuccessHandler(res => {
        hits = res.orders;
        if (keepMsg) setStatusAndScroll(keepMsg.cls, keepMsg.html); else setStatus('', '');
        // Nothing ticked selects nothing. Said plainly, because an
        // empty list with no explanation reads as a broken search.
        const empty = (!el('fDeliveredUnpaid').checked && !el('fUndelivered').checked)
          ? 'Cocher au moins une case pour afficher des commandes.'
          : (res.closedMatches > 0
              ? (res.closedMatches === 1
                  ? 'Commande livrée et payée.'
                  : res.closedMatches + ' commandes livrées et payées.')
              : 'Aucune commande trouvée.');
        el('hits').innerHTML = hits.length
          ? hits.map(o =>
              '<div class="hit" id="hit_'+esc(o.key)+'" data-key="'+esc(o.key)+'">' +
                '<b>' + esc(o.orderNumber || '(sans numéro)') + '</b> · ' + esc(o.client) +
                '<div class="muted">' + esc(o.dateCommande) + ' · lots : ' + esc(o.lots.join(', ') || '—') +
                hitQty(o) +
                (o.dateLivraison ? ' · livrée le ' + esc(o.dateLivraison) : ' · non livrée') +
                (o.paiement ? ' · payée le ' + esc(o.paiement) : ' · non payée') +
                ' · <b>' + fmtAr(o.montantAr) + '</b></div>' +
              '</div>').join('')
          : '<div class="warn">' + esc(empty) + '</div>';
      })
      .withFailureHandler(e => setStatus('err', esc(e.message)))
      .cmdFindOrders(el('ficherche').value,
        el('fDeliveredUnpaid').checked, el('fUndelivered').checked);
  }

  function selectHit(key) {
    selectedKey = key;
    hits.forEach(o => {
      const n = el('hit_' + o.key);
      if (n) n.className = 'hit' + (o.key === key ? ' sel' : '');
    });
    const o = hits.filter(h => h.key === key)[0];
    if (!o) return;
    const mp = String(o.moyenPaiement || '').trim().toLowerCase();

    const qtyParts = [];
    if (o.alevinsTotal > 0) qtyParts.push(Number(o.alevinsTotal).toLocaleString('fr-FR') + ' alevins');
    if (o.poissonKgTotal > 0) qtyParts.push(Number(o.poissonKgTotal).toLocaleString('fr-FR') + ' kg poisson');
    const qtyTxt = qtyParts.join(' · ') || '—';
    const montantTxt = Number(o.montantAr || 0).toLocaleString('fr-FR') + ' Ar';

    el('fulForm').innerHTML =
      '<div class="card"><h3>' + esc(o.orderNumber || '(sans numéro)') + ' — ' + esc(o.client) + '</h3>' +
        '<div class="row">' +
          '<div><label>Quantité commandée</label>' +
            '<div style="font-size:18px;font-weight:600;padding:4px 0">' + esc(qtyTxt) + '</div></div>' +
          '<div><label>Montant total</label>' +
            '<div style="font-size:18px;font-weight:600;padding:4px 0">' + esc(montantTxt) + '</div></div>' +
        '</div>' +
        '<div class="row">' +
          '<div><label>Paiement reçu le</label><input type="date" id="uPaiement" value="'+esc(toISO(o.paiement))+'"></div>' +
          '<div><label>Date livraison</label><input type="date" id="uLivraison" value="'+esc(toISO(o.dateLivraison))+'"></div>' +
        '</div>' +
        '<label>Moyen de paiement</label><select id="uMoyen">' +
          '<option value="">-- choisir --</option>' +
          '<option value="espèce"' + (mp === 'espèce' ? ' selected' : '') + '>espèce</option>' +
          '<option value="mobile"' + (mp === 'mobile' ? ' selected' : '') + '>mobile</option>' +
        '</select>' +
        '<div class="row">' +
          '<div><label>N° facture <span class="muted" style="font-weight:400">(optionnel)</span></label>' +
            '<input type="text" id="uFacture" placeholder="Généré automatiquement" ' +
              'value="'+esc(o.facture || '')+'"></div>' +
          '<div><label>Bon de livraison externe</label><input type="text" id="uBl" value="'+esc(o.bl || '')+'"></div>' +
        '</div>' +
        '<label>Remarques</label><input type="text" id="uRemarques" value="'+esc(o.remarques || '')+'">' +
        '<button class="go" id="btnFul" onclick="doFulfil()">Enregistrer</button>' +
        (o.dateLivraison ? '' :
        '<div style="margin-top:14px">' +
          '<button id="btnMod" onclick="loadModify()" ' +
            'style="background:#fff;color:#1a73e8;border:1px solid #1a73e8;' +
            'border-radius:4px;padding:10px 14px;font-size:17px;cursor:pointer">' +
            'Modifier la commande</button>' +
          '<div id="modZone"></div>' +
        '</div>') +
        '<div style="margin-top:18px;padding-top:14px;border-top:1px solid #dadce0">' +
          '<button id="btnCancel" onclick="askCancel()" ' +
            'style="background:#fff;color:#c5221f;border:1px solid #c5221f;' +
            'border-radius:4px;padding:10px 14px;font-size: 17px;cursor:pointer">' +
            'Annuler la commande</button>' +
        '</div>' +
      '</div>';

    // The results list can be long; make sure the form is actually seen.
    const node = el('fulForm');
    if (node && node.scrollIntoView) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /** Sheet shows dd/MM/yyyy; date inputs need yyyy-MM-dd. */
  function toISO(d) {
    if (!d) return '';
    const m = String(d).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m ? m[3]+'-'+m[2]+'-'+m[1] : '';
  }

  function doFulfil() {
    const o = hits.filter(h => h.key === selectedKey)[0];
    if (!o) return;
    const btn = el('btnFul');
    btn.disabled = true;
    setStatus('banner', 'Enregistrement…');

    google.script.run
      .withSuccessHandler(res => {
        // The invoice message is the whole confirmation.
        //
        // THE LINE IS ALWAYS THERE. An earlier version showed it only
        // when a number was minted, so a save that minted nothing left
        // the user unable to tell whether the invoice had been handled.
        // Every save states the invoice position, including "no number,
        // and why".
        //
        // 2026-08-30 (Kim): the muted "N modification(s) enregistrée(s)"
        // line that used to sit under this was removed on request.
        // KNOWN CONSEQUENCE, accepted, do not re-add without asking:
        // a save that writes only the moyen de paiement or the remarques
        // now shows an invoice line identical to the one before it, so
        // there is no on-screen proof that such a save landed.
        // res.changed is still returned by the server and still carries
        // the detail — nothing reads it here any more.
        const line = res.facture
          ? 'Numéro facture enregistré : <b>' + esc(res.facture) + '</b>'
          : (res.factureNow
              ? 'Numéro facture : <b>' + esc(res.factureNow) + '</b> — ' +
                esc(res.factureWhy || '')
              : 'Pas de numéro facture — ' + esc(res.factureWhy || ''));

        doSearch({ cls: 'ok', html: line });
      })
      .withFailureHandler(e => { btn.disabled = false; setStatusAndScroll('err', esc(e.message)); })
      .cmdRecordFulfilment(o.rows, {
        paiement: el('uPaiement').value,
        dateLivraison: el('uLivraison').value,
        moyenPaiement: el('uMoyen').value,
        facture: el('uFacture').value,
        bl: el('uBl').value,
        remarques: el('uRemarques').value
      });
  }

  /**
   * MODIFIER LA COMMANDE. Only quantities and PM are editable; the
   * money columns are sheet formulas and recompute on their own. The
   * server refuses delivered/cancelled orders and validates any stock
   * increase; if the engine already deducted, it corrects the lot file
   * by the delta at once. res.stock is the proof, shown line by line.
   */
  var modLines = [];

  function loadModify() {
    const o = hits.filter(h => h.key === selectedKey)[0];
    if (!o) return;
    el('btnMod').disabled = true;
    setStatus('banner', 'Chargement\u2026');
    google.script.run
      .withSuccessHandler(lines => {
        setStatus('', '');
        modLines = lines;
        el('modZone').innerHTML =
          lines.map((ln, i) =>
            '<div class="row" style="margin-top:8px">' +
              '<div style="align-self:center;font-weight:600;padding-top:14px">' +
                esc(ln.lot) + '</div>' +
              (ln.isAlevins
                ? '<div><label>Nombre d\'alevins</label>' +
                    '<input type="text" inputmode="decimal" id="modQ' + i + '" value="' +
                    (ln.nombre == null ? '' : ln.nombre) + '"></div>'
                : '<div><label>Poisson (kg)</label>' +
                    '<input type="text" inputmode="decimal" id="modQ' + i + '" value="' +
                    (ln.kg == null ? '' : ln.kg) + '"></div>') +
              '<div><label>PM (g)</label>' +
                '<input type="text" inputmode="decimal" id="modP' + i + '" value="' +
                ((ln.isAlevins ? ln.pmAl : ln.pmGr) == null ? ''
                  : (ln.isAlevins ? ln.pmAl : ln.pmGr)) + '"></div>' +
            '</div>').join('') +
          '<button class="go" id="btnModSave" onclick="doModify()">' +
            'Enregistrer les modifications</button>';
      })
      .withFailureHandler(e => {
        el('btnMod').disabled = false;
        setStatusAndScroll('err', esc(e.message));
      })
      .cmdGetOrderLines(o.rows);
  }

  function doModify() {
    if (!modLines.length) return;
    const lines = modLines.map((ln, i) => {
      const q = el('modQ' + i).value;
      const p = el('modP' + i).value;
      return ln.isAlevins
        ? { row: ln.row, nombre: q, pm: p }
        : { row: ln.row, kg: q, pm: p };
    });
    const btn = el('btnModSave');
    btn.disabled = true;
    setStatus('banner', 'Enregistrement\u2026');
    google.script.run
      .withSuccessHandler(res => {
        // The stock lines ARE the confirmation: they state, per lot,
        // whether the correction happened now, happens tonight, or
        // FAILED and needs Kim. Never swallowed into a generic "OK".
        const parts = []
          .concat(res.stock || [])
          .concat(res.warnings || []);
        doSearch({ cls: 'ok',
          html: 'Commande modifi\u00e9e.' +
                (parts.length ? '<br>' + parts.map(esc).join('<br>') : '') });
      })
      .withFailureHandler(e => {
        btn.disabled = false;
        setStatusAndScroll('err', esc(e.message));
      })
      .cmdModifyOrder({ lines: lines });
  }

  /**
   * First click arms the button, second click cancels. Deliberately not
   * window.confirm(): a dialog can be blocked inside this frame, and a
   * blocked dialog leaves the button silently doing nothing. selectHit
   * rebuilds the card, so the armed state never survives a reselect.
   */
  function askCancel() {
    const b = el('btnCancel');
    if (!b) return;
    if (b.getAttribute('data-armed') === '1') { doCancel(); return; }
    b.setAttribute('data-armed', '1');
    b.textContent = "Confirmer l'annulation \u2014 d\u00e9finitif";
    b.style.background = '#c5221f';
    b.style.color = '#fff';
  }

  function doCancel() {
    const o = hits.filter(h => h.key === selectedKey)[0];
    if (!o) return;
    const b = el('btnCancel');
    b.disabled = true;
    setStatus('banner', 'Annulation\u2026');
    google.script.run
      .withSuccessHandler(res => {
        doSearch({ cls: 'ok',
          html: 'Commande annul\u00e9e \u2014 ' + res.rows.length + ' ligne(s). ' +
                'Si elle avait d\u00e9j\u00e0 \u00e9t\u00e9 d\u00e9duite, le stock ' +
                'sera recr\u00e9dit\u00e9 cette nuit.' });
      })
      .withFailureHandler(e => { b.disabled = false; setStatusAndScroll('err', esc(e.message)); })
      .cmdCancelOrder(o.rows);
  }
</script>
</body>
