<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 22px; }
    a.tile { display: block; text-decoration: none; color: inherit; border: 1px solid #dadce0;
             border-radius: 8px; padding: 18px 20px; margin-top: 14px; }
    a.tile:hover { background: #f8f9fa; }
    a.tile h2 { margin: 0 0 4px 0; font-size: 17px; color: #1a73e8; }
    a.tile p { margin: 0; font-size: 13px; color: #5f6368; }
    a.tile.warn { border-color: #c5221f; }
    a.tile.warn h2, a.tile.warn p { color: #c5221f; }
    a.tile.warn .note { font-size: 12px; font-weight: bold; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>TSARA Entry</h1>
  <div id="tiles">Chargement…</div>

  <script>
    google.script.run.withSuccessHandler(function (url) {
      document.getElementById('tiles').innerHTML =
        '<a class="tile" href="' + url + '?screen=temperatures">' +
          '<h2>Températures + impressions stock poisson &amp; programme</h2><p>Température bassin et lac</p></a>' +
        '<a class="tile" href="' + url + '?screen=nourrissage">' +
          '<h2>Nourrissage</h2><p>Saisie des quantités de provende distribuées</p></a>' +
        '<a class="tile" href="' + url + '?screen=creerlot">' +
          '<h2>Créer un lot</h2><p>Nouveau fichier lot — grossissement ou géniteurs</p></a>' +
        '<a class="tile" href="' + url + '?screen=commandes">' +
          '<h2>Commandes</h2><p>Nouvelle commande · paiement &amp; livraison</p></a>' +
        '<a class="tile" href="' + url + '?screen=morts">' +
          '<h2>Mortalité</h2><p>Déclaration des poissons morts</p></a>' +
        '<a class="tile warn" href="' + url + '?screen=lot">' +
          '<h2>Échantillonnage de lot</h2><p>Poids moyen, nombre, biomasse</p>' +
          '<p class="note">(seulement lot 31 et plus)</p></a>' +
        '<a class="tile warn" href="' + url + '?screen=tracabilite">' +
          '<h2>Mouvement de lot</h2><p>Tri, déplacement, mélange, mise en cage</p>' +
          '<p class="note">(seulement lot 31 et plus)</p></a>';
    }).getWebAppUrl();
  </script>
</body>
</html>
